name: Package Compatibility

# Which popular packages work in Cortex (tests/e2e/compat.sh): every night with the latest release, on
# the API 34 emulator, and on request with another release. The table is in the job summary and the
# logs of each package are in the artifact. A package that does not work is a finding: the run only
# fails when the test itself does.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      release:
        description: "The release to test (its tag; empty: the latest)"
        type: string
        default: ""
      only:
        description: "Only these packages (names of the table, separated by spaces; empty: all)"
        type: string
        default: ""
      apk_run:
        description: "Test the APKs of this run of Build and Release (a dry run's artifact) instead of a release"
        type: string
        default: ""

permissions:
  contents: read
  actions: read

# The nightly run of the latest release also updates docs/compat.json, which the website's
# compatibility page shows (see "Publish the results on the website").

concurrency:
  group: package-compatibility
  cancel-in-progress: false

jobs:
  compat:
    name: Packages on the emulator (API 34, arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the release's APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
          APK_RUN: ${{ inputs.apk_run }}
        run: |
          set -euo pipefail
          mkdir -p apks
          if [ -n "$APK_RUN" ]; then
            # The APKs a run of Build and Release made (a dry run keeps them for a day)
            gh run download "$APK_RUN" --repo "$GITHUB_REPOSITORY" --name cortex-release-apks --dir apk-run
            cp "$(find apk-run -name 'Cortex-arm64-v8a-signed.apk' | head -n 1)" apks/
            echo "run $APK_RUN" > tag.txt
          else
            # Without a tag, gh takes the latest release ($TAG is left unquoted for that)
            gh release download $TAG --repo "$GITHUB_REPOSITORY" --pattern 'Cortex-arm64-v8a-signed.apk' --dir apks
            gh release view $TAG --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName > tag.txt
          fi
          echo "Testing $(cat tag.txt)"
          ls -l apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and try the packages on the emulator
        id: emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          E2E_COMPAT_ONLY: ${{ inputs.only }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disk-size: 12G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: E2E_MODE=compat E2E_SCRIPT=tests/e2e/compat.sh E2E_TIMEOUT=9000 bash tests/e2e/run-emulator-test.sh apks e2e-out arm64-v8a

      - name: Table of the packages
        if: always()
        run: bash tests/e2e/compat-summary.sh e2e-out/cortex-e2e/results.txt "$(cat tag.txt 2>/dev/null)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-compatibility
          path: e2e-out
          retention-days: 30

      # Only the scheduled run of the latest release: a run with a chosen release, some packages
      # or a dry run's APKs is not what the page describes. The commit only touches docs/ and
      # skips CI.
      - name: Publish the results on the website
        # A run that timed out leaves part of the list: only a finished one replaces the page's
        if: always() && steps.emulator.outcome == 'success' && github.event_name == 'schedule' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          RESULTS=e2e-out/cortex-e2e/results.txt
          if [ ! -e e2e-out/cortex-e2e/done ] || [ ! -s "$RESULTS" ] || ! grep -q '^\(PASS\|FAIL\) ' "$RESULTS"; then
            echo "No complete results to publish."
            exit 0
          fi
          python3 tests/e2e/compat-json.py "$RESULTS" "$(cat tag.txt)" "$(date -u +%F)" > docs/compat.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/compat.json
          # Not a commit a day: only when a result or the release changed (the date alone does not)
          if ! git diff --cached -U0 | grep '^[-+] ' | grep -vq '"date"'; then
            echo "The results did not change."
            exit 0
          fi
          git commit -m "Package compatibility of $(cat tag.txt) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --quiet origin main && git push origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          echo "Could not push the results." >&2
          exit 1
