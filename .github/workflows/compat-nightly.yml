name: Package Compatibility

# Which popular packages work in Cortex (tests/e2e/compat.sh): every night with the latest release, on
# the API 34 emulator, and on request with another release. The table is in the job summary and the
# logs of each package are in the artifact. A package that does not work is a finding: the run only
# fails when the test itself does.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      release:
        description: "The release to test (its tag; empty: the latest)"
        type: string
        default: ""
      only:
        description: "Only these packages (names of the table, separated by spaces; empty: all)"
        type: string
        default: ""
      apk_run:
        description: "Test the APKs of this run of Build and Release (a dry run's artifact) instead of a release"
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: package-compatibility
  cancel-in-progress: false

jobs:
  compat:
    name: Packages on the emulator (API 34, arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the release's APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
          APK_RUN: ${{ inputs.apk_run }}
        run: |
          set -euo pipefail
          mkdir -p apks
          if [ -n "$APK_RUN" ]; then
            # The APKs a run of Build and Release made (a dry run keeps them for a day)
            gh run download "$APK_RUN" --repo "$GITHUB_REPOSITORY" --name cortex-release-apks --dir apk-run
            cp "$(find apk-run -name 'Cortex-arm64-v8a-signed.apk' | head -n 1)" apks/
            echo "run $APK_RUN" > tag.txt
          else
            # Without a tag, gh takes the latest release ($TAG is left unquoted for that)
            gh release download $TAG --repo "$GITHUB_REPOSITORY" --pattern 'Cortex-arm64-v8a-signed.apk' --dir apks
            gh release view $TAG --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName > tag.txt
          fi
          echo "Testing $(cat tag.txt)"
          ls -l apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and try the packages on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          E2E_COMPAT_ONLY: ${{ inputs.only }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disk-size: 12G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: E2E_MODE=compat E2E_SCRIPT=tests/e2e/compat.sh E2E_TIMEOUT=9000 bash tests/e2e/run-emulator-test.sh apks e2e-out arm64-v8a

      - name: Table of the packages
        if: always()
        run: bash tests/e2e/compat-summary.sh e2e-out/cortex-e2e/results.txt "$(cat tag.txt 2>/dev/null)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-compatibility
          path: e2e-out
          retention-days: 30
