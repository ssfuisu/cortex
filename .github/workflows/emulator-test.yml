name: Emulator Test

# End-to-end test of a built APK on an Android emulator (tests/e2e/run-emulator-test.sh). Called by
# "Build and Release Cortex APKs" after its build, and kept in its own file so that changing the
# test does not invalidate that workflow's caches (their keys include its file).
on:
  workflow_call:
    inputs:
      run-id:
        description: "Run that uploaded the artifact (empty: the calling run)"
        type: string
        default: ""

jobs:
  emulator:
    name: Ubuntu on an Android emulator (API ${{ matrix.api-level }}, ${{ matrix.abi }}${{ matrix.page-size && ', 16 KB pages' || '' }})
    # GitHub's x86_64 Linux runners have KVM; the ARM Ubuntu runs through the image's ARM translation.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Android 14: Android 11's translator crashes every forked arm64 glibc process (it clones
          # with CLONE_SETTLS and tls=NULL), and the API 33 image translates nothing. GitHub's arm64
          # runners have no KVM for an arm64 emulator.
          - id: api34
            api-level: 34
            target: google_apis
            abi: arm64-v8a
            experimental: false
          # The 32-bit APK: of Google's x86_64 images only Android 11's translates 32-bit ARM code
          # (the later ones run 64-bit apps only), and it stops Ubuntu's armhf programs, so this
          # tests the app as far as an installed and set-up Ubuntu (RUN_UBUNTU in
          # run-emulator-test.sh).
          - id: api30-armeabi-v7a
            api-level: 30
            target: google_apis
            abi: armeabi-v7a
            experimental: false
          # Phones with 16 KB memory pages (Android 15 on, such as the Pixel 8 with the developer
          # option): Google's 16 KB image. Whether its translator runs arm64 apps is not known
          # beforehand, so an image without one is a skip; until it has passed, a failure does not
          # fail the run.
          - id: api35-16k
            api-level: 35
            target: google_apis_ps16k
            abi: arm64-v8a
            page-size: 16384
            skip-without-abi: 1
            # Its translator spins forever in apt's signature check (gpgv); phones with 16 KB
            # pages run Ubuntu's code themselves
            no-apt: 1
            experimental: true
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # cortex-debug-apk (pull requests) or cortex-release-apks (other runs)
      - name: Download the APKs of this run
        if: inputs.run-id == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cortex-*-apk*
          merge-multiple: true
          path: apks

      - name: Download the APKs of an earlier run
        if: inputs.run-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cortex-*-apk*
          merge-multiple: true
          path: apks
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l apks

      # The start-up figures of earlier runs (timing-trend.sh), kept in the Actions cache
      - name: Restore the start-up timing history
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: e2e-history
          key: e2e-timings-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: e2e-timings-${{ matrix.id }}-

      - name: Run the test on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # Its x86_64 image translates ARM code
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.target }}
          profile: pixel_6
          ram-size: 4096M
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: E2E_PAGE_SIZE=${{ matrix.page-size }} E2E_SKIP_WITHOUT_ABI=${{ matrix.skip-without-abi || 0 }} E2E_NO_APT=${{ matrix.no-apt || 0 }} bash tests/e2e/run-emulator-test.sh apks e2e-out ${{ matrix.abi }}

      - name: Compare the start-up times with earlier runs
        if: always() && hashFiles('e2e-out/timings.env') != ''
        run: |
          {
            echo "### Start-up times (API ${{ matrix.api-level }} emulator, ${{ matrix.abi }})"
            echo
            bash tests/e2e/timing-trend.sh e2e-out/timings.env e2e-history/timings.csv "${{ github.run_id }}/${GITHUB_SHA::7}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save the start-up timing history
        if: always() && hashFiles('e2e-history/timings.csv') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: e2e-history
          key: e2e-timings-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload results and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-test-results-${{ matrix.id }}
          path: e2e-out
          retention-days: 14
