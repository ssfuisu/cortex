name: Build and Release Cortex APKs

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Cache Android NDK and CMake
        uses: actions/cache@v4
        id: cache-ndk
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/26.1.10909125
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: ndk-26.1.10909125-cmake-3.22.1

      - name: Install Android NDK and CMake
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Gradle Wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar || gradle wrapper --gradle-version 8.7 || true
          fi
          chmod +x gradlew

      - name: Verify or Generate Release Signing Key
        run: |
          if [ ! -f app/cortex-release.keystore ]; then
            echo "Generating release signing keystore..."
            keytool -genkeypair -v \
              -keystore app/cortex-release.keystore \
              -alias cortex \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass cortexpassword \
              -keypass cortexpassword \
              -dname "CN=Cortex, OU=Terminal, O=Cortex, C=US"
          else
            echo "Committed permanent release keystore found, using existing keystore."
          fi

      - name: Build Glibc cortex-hook Libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf libc6-dev-arm64-cross libc6-dev-armhf-cross dpkg-dev
          mkdir -p hook-libs
          aarch64-linux-gnu-gcc -std=gnu11 -shared -fPIC -O3 -Wall -Wno-nonnull-compare -o hook-libs/libcortex-hook-arm64.so app/src/main/cpp/cortex-hook.c -ldl
          arm-linux-gnueabihf-gcc -std=gnu11 -shared -fPIC -O3 -Wall -Wno-nonnull-compare -o hook-libs/libcortex-hook-arm.so app/src/main/cpp/cortex-hook.c -ldl

          echo "Verifying Glibc version requirements in hook libraries..."
          if readelf -V hook-libs/*.so | grep -E "GLIBC_2\.([4-9][0-9])"; then
            echo "ERROR: libcortex-hook.so requires GLIBC version higher than 2.39!"
            exit 1
          fi
          echo "All hook libraries verified: fully compatible with Ubuntu 24.04 LTS (glibc <= 2.39)."

      - name: Bundle Ubuntu 24.04 LTS Glibc Bootstrap into APK
        run: |
          mkdir -p app/src/main/assets

          cp hook-libs/libcortex-hook-arm64.so app/src/main/assets/libcortex-hook-arm64.so
          cp hook-libs/libcortex-hook-arm.so app/src/main/assets/libcortex-hook-arm.so

          echo "Preparing dpkg tables, APT sandbox, hosts, and DNS config for bootstrap..."
          mkdir -p extra-rootfs/usr/share/dpkg extra-rootfs/etc/apt/apt.conf.d extra-rootfs/var/cache/apt/archives/partial extra-rootfs/var/lib/apt/lists/partial extra-rootfs/tmp extra-rootfs/etc extra-rootfs/etc/dpkg/dpkg.cfg.d extra-rootfs/etc/profile.d extra-rootfs/usr/sbin extra-rootfs/etc/ssl/certs
          curl -sLo extra-rootfs/etc/ssl/certs/ca-certificates.crt https://curl.se/ca/cacert.pem || true
          mkdir -p extra-rootfs/usr/lib/ssl extra-rootfs/etc/pki/tls/certs
          cp extra-rootfs/etc/ssl/certs/ca-certificates.crt extra-rootfs/etc/ssl/cert.pem
          cp extra-rootfs/etc/ssl/certs/ca-certificates.crt extra-rootfs/usr/lib/ssl/cert.pem
          cp extra-rootfs/etc/ssl/certs/ca-certificates.crt extra-rootfs/etc/pki/tls/certs/ca-bundle.crt
          if [ -d /usr/share/dpkg ]; then
            cp -r /usr/share/dpkg/* extra-rootfs/usr/share/dpkg/
          fi
          if [ -d /usr/share/zoneinfo ]; then
            mkdir -p extra-rootfs/usr/share
            cp -r /usr/share/zoneinfo extra-rootfs/usr/share/
          fi
          if [ -f extra-rootfs/usr/share/dpkg/tupletable ]; then
            cp extra-rootfs/usr/share/dpkg/tupletable extra-rootfs/usr/share/dpkg/triplettable
          fi
          printf 'APT::Sandbox::User "root";\nAPT::Sandbox::Seccomp "false";\nAcquire::ForceIPv4 "true";\nAcquire::Connect::AddrConfig "false";\nAcquire::SRV "false";\nAcquire::Languages "none";\nAcquire::GzipIndexes "true";\nDir::dpkg::cputable "/usr/share/dpkg/cputable";\nDir::dpkg::tupletable "/usr/share/dpkg/tupletable";\nDir::dpkg::triplettable "/usr/share/dpkg/triplettable";\nDPkg::Install::Recursive "false";\nDpkg::Progress-Fancy "false";\nAPT::Color "false";\nDPkg::Options {\n   "--force-confdef";\n   "--force-confold";\n   "--force-unsafe-io";\n};\n' > extra-rootfs/etc/apt/apt.conf.d/01sandbox
          echo "# Disabled for Cortex" > extra-rootfs/etc/apt/apt.conf.d/docker-clean
          printf 'force-confdef\nforce-confold\nforce-unsafe-io\nno-debsig\n' > extra-rootfs/etc/dpkg/dpkg.cfg.d/01cortex
          printf 'export DPKG_DEB_THREADS_MAX=1\nexport XZ_OPT=-T1\nexport XZ_DEFAULTS=-T1\nexport TAR_OPTIONS=--no-same-owner\nexport DEBIAN_FRONTEND=noninteractive\nexport DEBCONF_FRONTEND=noninteractive\nexport DEBCONF_NONINTERACTIVE_SEEN=true\nif [ -n "$CORTEX_ROOT" ]; then\n  export SSL_CERT_FILE="$CORTEX_ROOT/etc/ssl/certs/ca-certificates.crt"\n  export SSL_CERT_DIR="$CORTEX_ROOT/etc/ssl/certs:/system/etc/security/cacerts"\n  export CURL_CA_BUNDLE="$CORTEX_ROOT/etc/ssl/certs/ca-certificates.crt"\n  export NODE_EXTRA_CA_CERTS="$CORTEX_ROOT/etc/ssl/certs/ca-certificates.crt"\n  export REQUESTS_CA_BUNDLE="$CORTEX_ROOT/etc/ssl/certs/ca-certificates.crt"\nelse\n  export SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt\n  export CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt\nfi\nexport TZDIR=/usr/share/zoneinfo\n' > extra-rootfs/etc/profile.d/01cortex.sh

          printf '#!/bin/sh\nexit 101\n' > extra-rootfs/usr/sbin/policy-rc.d
          printf '#!/bin/sh\nexit 0\n' > extra-rootfs/usr/sbin/ldconfig
          printf '#!/bin/sh\nexit 0\n' > extra-rootfs/usr/sbin/start-stop-daemon
          mkdir -p extra-rootfs/boot extra-rootfs/media extra-rootfs/mnt extra-rootfs/srv extra-rootfs/opt extra-rootfs/run extra-rootfs/tmp
          chmod 0755 extra-rootfs/boot extra-rootfs/media extra-rootfs/mnt extra-rootfs/srv extra-rootfs/opt extra-rootfs/usr/sbin/*
          printf 'root:x:0:\ndaemon:x:1:\ncortex:x:0:\n' > extra-rootfs/etc/group
          printf 'root:x:0:0:root:/home:/bin/bash\ncortex:x:0:0:Cortex:/home:/bin/bash\n' > extra-rootfs/etc/passwd

          printf '127.0.0.1 localhost localhost.localdomain\n::1 localhost ip6-localhost ip6-loopback\n91.189.91.103 ports.ubuntu.com\n91.189.92.21 ports.ubuntu.com\n91.189.91.102 ports.ubuntu.com\n91.189.92.20 ports.ubuntu.com\n185.125.190.81 archive.ubuntu.com\n91.189.91.81 archive.ubuntu.com\n185.125.190.82 security.ubuntu.com\n91.189.91.82 security.ubuntu.com\n151.101.130.132 deb.debian.org\n151.101.2.132 deb.debian.org\n151.101.66.132 deb.debian.org\n151.101.194.132 deb.debian.org\n151.101.130.132 security.debian.org\n151.101.2.132 security.debian.org\n151.101.66.132 security.debian.org\n151.101.194.132 security.debian.org\n151.101.130.132 cdn-fastly.deb.debian.org\n151.101.2.132 cdn-fastly.deb.debian.org\n' > extra-rootfs/etc/hosts
          printf 'nameserver 8.8.8.8\nnameserver 1.1.1.1\noptions timeout:1 attempts:2 rotate\n' > extra-rootfs/etc/resolv.conf
          printf 'passwd:         files\ngroup:          files\nshadow:         files\ngshadow:        files\n\nhosts:          files dns\nnetworks:       files\n\nprotocols:      db files\nservices:       db files\nethers:         db files\nrpc:            db files\n' > extra-rootfs/etc/nsswitch.conf

          echo "Preparing 64-bit Ubuntu 24.04 LTS minimal bootstrap..."
          docker pull --platform linux/arm64 ubuntu:24.04
          CID_64=$(docker create --platform linux/arm64 ubuntu:24.04)
          docker cp hook-libs/libcortex-hook-arm64.so "$CID_64":/usr/lib/libcortex-hook.so
          docker cp extra-rootfs/. "$CID_64":/
          docker export "$CID_64" > app/src/main/assets/bootstrap-arm64.tar
          docker rm "$CID_64"

          echo "Preparing 32-bit Ubuntu 24.04 LTS minimal bootstrap..."
          docker pull --platform linux/arm/v7 ubuntu:24.04
          CID_32=$(docker create --platform linux/arm/v7 ubuntu:24.04)
          docker cp hook-libs/libcortex-hook-arm.so "$CID_32":/usr/lib/libcortex-hook.so
          docker cp extra-rootfs/. "$CID_32":/
          docker export "$CID_32" > app/src/main/assets/bootstrap-arm.tar
          docker rm "$CID_32"

          echo "Patching dynamic linkers in bootstrap archives for Android seccomp compliance..."
          python3 - << 'EOF'
          import tarfile, io, os

          def patch_tar_ld(tar_path):
              print(f"Checking and patching dynamic linkers and libc in {tar_path}...")
              svc = b"\x01\x00\x00\xd4"          # svc #0
              nop = b"\x1f\x20\x03\xd5"          # nop
              mov_enosys = b"\xa0\x04\x80\x92"   # mov x0, #-38

              patches = [
                  ("set_robust_list", b"\x68\x0c\x80\xd2", nop),        # mov x8, #0x63 (99) -> nop
                  ("clone3",          b"\x68\x36\x80\xd2", mov_enosys), # mov x8, #0x1b3 (435) -> mov x0, #-38
                  ("rseq",            b"\xa8\x24\x80\xd2", mov_enosys), # mov x8, #0x125 (293) -> mov x0, #-38
              ]

              count = 0
              with tarfile.open(tar_path, "r") as tin:
                  members = tin.getmembers()
                  with tarfile.open(tar_path + ".tmp", "w") as tout:
                      for m in members:
                          if m.name == "home/ubuntu" or m.name.startswith("home/ubuntu/"):
                              continue
                          if m.name in ["home/bashrc", "home/profile"]:
                              continue
                          if m.issym() and m.linkname.startswith("/"):
                              parent = os.path.dirname(m.name)
                              target = m.linkname.lstrip("/")
                              rel = os.path.relpath(target, parent)
                              m.linkname = rel
                          f = tin.extractfile(m) if m.isreg() else None
                          if f and ("ld-linux" in m.name or "libc.so" in m.name or "libc-" in m.name):
                              data = bytearray(f.read())
                              file_patched = 0
                              for sc_name, pat, repl in patches:
                                  pos = 0
                                  while True:
                                      idx = data.find(pat, pos)
                                      if idx == -1: break
                                      sub = data[idx:idx+64]
                                      s_idx = sub.find(svc)
                                      if s_idx != -1:
                                          target = idx + s_idx
                                          data[target:target+4] = repl
                                          file_patched += 1
                                          count += 1
                                          print(f"Patched {sc_name} at 0x{target:x} in {m.name}")
                                      pos = idx + 4
                              if file_patched > 0:
                                  print(f"Total patched in {m.name}: {file_patched}")
                              m.size = len(data)
                              tout.addfile(m, io.BytesIO(data))
                          elif f:
                              tout.addfile(m, f)
                          else:
                              tout.addfile(m)
              os.replace(tar_path + ".tmp", tar_path)
              print(f"Finished patching {tar_path}: {count} occurrences patched.")

          if os.path.exists("app/src/main/assets/bootstrap-arm64.tar"):
              patch_tar_ld("app/src/main/assets/bootstrap-arm64.tar")
          if os.path.exists("app/src/main/assets/bootstrap-arm.tar"):
              patch_tar_ld("app/src/main/assets/bootstrap-arm.tar")
          EOF

          ls -lh app/src/main/assets/

      - name: Build Release APKs
        run: |
          ./gradlew assembleRelease --build-cache --parallel --stacktrace

      - name: Prepare and Verify Signed APKs
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          
          mkdir -p release-apks

          ARM64_RAW=$(find app/build/outputs/apk/release -name "*arm64-v8a*.apk" | head -n 1)
          ARM32_RAW=$(find app/build/outputs/apk/release -name "*armeabi-v7a*.apk" | head -n 1)

          echo "Found 64-bit APK: $ARM64_RAW"
          echo "Found 32-bit APK: $ARM32_RAW"

          # Sign or copy 64-bit
          if $APKSIGNER verify "$ARM64_RAW" >/dev/null 2>&1; then
            cp "$ARM64_RAW" release-apks/Cortex-arm64-v8a-signed.apk
          else
            $APKSIGNER sign \
              --ks app/cortex-release.keystore \
              --ks-pass pass:cortexpassword \
              --key-pass pass:cortexpassword \
              --out release-apks/Cortex-arm64-v8a-signed.apk \
              "$ARM64_RAW"
          fi

          # Sign or copy 32-bit
          if $APKSIGNER verify "$ARM32_RAW" >/dev/null 2>&1; then
            cp "$ARM32_RAW" release-apks/Cortex-armeabi-v7a-signed.apk
          else
            $APKSIGNER sign \
              --ks app/cortex-release.keystore \
              --ks-pass pass:cortexpassword \
              --key-pass pass:cortexpassword \
              --out release-apks/Cortex-armeabi-v7a-signed.apk \
              "$ARM32_RAW"
          fi

          # Verify Signatures
          $APKSIGNER verify release-apks/Cortex-arm64-v8a-signed.apk
          $APKSIGNER verify release-apks/Cortex-armeabi-v7a-signed.apk

          echo "APKs signed and verified successfully."

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cortex-release-apks
          path: release-apks/*.apk

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OFFSET=$(( ${{ github.run_number }} - 34 ))
          if [ "$OFFSET" -lt 0 ]; then OFFSET=0; fi
          VERSION="v1.24.${OFFSET}"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          fi

          NOTES="Cortex Release $VERSION (Ubuntu 24.04 LTS Noble Numbat)

          Features and Improvements:
          - Native Ubuntu 24.04 LTS (Noble Numbat) Rootfs: Upgraded base userland to Ubuntu 24.04 LTS with glibc 2.39, providing modern package repositories, libraries, and tools completely natively on Android without chroot, proot, or virtualization.
          - Seccomp Syscall Compatibility for Modern CLIs: Patched glibc dynamic linkers and C libraries to handle clone3, rseq, and set_robust_list without triggering Android kernel seccomp SIGSYS traps, enabling Antigravity CLI, Go binaries, and modern runtimes to execute flawlessly.
          - Full Dpkg Filesystem Path Redirection: Updated libcortex-hook path rewriting to dynamically redirect all rootfs directories (/boot, /media, /snap, etc.) to Cortex root, preventing Read-only file system errors during dpkg deb extractions.
          - Robust User and Group Resolution: Added synthetic fallbacks for getgrgid, getgrnam, getpwuid, and getpwnam in libcortex-hook and ensured /etc/group definitions, permanently resolving 'cannot find name for group ID 0'.
          - Clean Home Directory: Cleaned up extraneous ubuntu subfolder and unhidden files from ~, maintaining a standard, tidy home directory layout.
          - Zero-Overhead LD_PRELOAD Hooking: Full user-space system call translation via libcortex-hook, delivering native CPU execution speed and zero background context switching.
          - Root CA Certificate Verification for Go, Node, Python, and Curl: Configured absolute SSL_CERT_FILE and SSL_CERT_DIR pointing to Ubuntu and Android system certificate stores.
          - Dual Trust Store Merging: Automatically merges Android system root certificates with Ubuntu CA bundles and provides compatibility symlinks for OpenSSL, GnuTLS, and Go TLS.
          - Accurate Local Timezone Clock and TZDIR: Full /usr/share/zoneinfo database bundled into bootstrap archives with POSIX timezone synchronization.
          - Native source and reload Support: Immediate environment reloading into current terminal session.
          - Permanent Keystore Signature: Uses permanent release key for seamless application updates."

          gh release create "$VERSION" \
            release-apks/Cortex-arm64-v8a-signed.apk \
            release-apks/Cortex-armeabi-v7a-signed.apk \
            --title "Cortex Release $VERSION" \
            --notes "$NOTES"
