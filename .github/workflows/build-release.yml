name: Build and Release Cortex APKs

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android NDK and CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Gradle Wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar || gradle wrapper --gradle-version 8.7 || true
          fi
          chmod +x gradlew

      - name: Generate Release Signing Key
        run: |
          keytool -genkeypair -v \
            -keystore app/cortex-release.keystore \
            -alias cortex \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass cortexpassword \
            -keypass cortexpassword \
            -dname "CN=Cortex, OU=Terminal, O=Cortex, C=US"

      - name: Build Glibc cortex-hook Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf dpkg-dev
          mkdir -p hook-libs
          aarch64-linux-gnu-gcc -shared -fPIC -O3 -Wall -o hook-libs/libcortex-hook-arm64.so app/src/main/cpp/cortex-hook.c -ldl
          arm-linux-gnueabihf-gcc -shared -fPIC -O3 -Wall -o hook-libs/libcortex-hook-arm.so app/src/main/cpp/cortex-hook.c -ldl

      - name: Bundle Debian Glibc Minimal Bootstrap into APK
        run: |
          mkdir -p app/src/main/assets

          cp hook-libs/libcortex-hook-arm64.so app/src/main/assets/libcortex-hook-arm64.so
          cp hook-libs/libcortex-hook-arm.so app/src/main/assets/libcortex-hook-arm.so

          echo "Preparing dpkg tables and APT sandbox config for bootstrap..."
          mkdir -p extra-rootfs/usr/share/dpkg extra-rootfs/etc/apt/apt.conf.d
          if [ -d /usr/share/dpkg ]; then
            cp -r /usr/share/dpkg/* extra-rootfs/usr/share/dpkg/
          fi
          if [ -f extra-rootfs/usr/share/dpkg/tupletable ]; then
            cp extra-rootfs/usr/share/dpkg/tupletable extra-rootfs/usr/share/dpkg/triplettable
          fi
          printf 'APT::Sandbox::User "root";\nAcquire::Languages "none";\nAcquire::GzipIndexes "true";\nDir::dpkg::cputable "/usr/share/dpkg/cputable";\nDir::dpkg::tupletable "/usr/share/dpkg/tupletable";\nDir::dpkg::triplettable "/usr/share/dpkg/triplettable";\n' > extra-rootfs/etc/apt/apt.conf.d/01sandbox
          echo "# Disabled for Cortex" > extra-rootfs/etc/apt/apt.conf.d/docker-clean

          echo "Preparing 64-bit Debian Glibc minimal bootstrap..."
          docker pull --platform linux/arm64 debian:bookworm-slim
          CID_64=$(docker create --platform linux/arm64 debian:bookworm-slim)
          docker cp hook-libs/libcortex-hook-arm64.so "$CID_64":/usr/lib/libcortex-hook.so
          docker cp extra-rootfs/. "$CID_64":/
          docker export "$CID_64" > app/src/main/assets/bootstrap-arm64.tar
          docker rm "$CID_64"

          echo "Preparing 32-bit Debian Glibc minimal bootstrap..."
          docker pull --platform linux/arm/v7 debian:bookworm-slim
          CID_32=$(docker create --platform linux/arm/v7 debian:bookworm-slim)
          docker cp hook-libs/libcortex-hook-arm.so "$CID_32":/usr/lib/libcortex-hook.so
          docker cp extra-rootfs/. "$CID_32":/
          docker export "$CID_32" > app/src/main/assets/bootstrap-arm.tar
          docker rm "$CID_32"

          echo "Patching dynamic linkers in bootstrap archives for Android seccomp compliance..."
          python3 - << 'EOF'
          import tarfile, io, os

          def patch_tar_ld(tar_path):
              print(f"Checking and patching dynamic linkers in {tar_path}...")
              pattern = b"\x68\x0c\x80\xd2" # mov x8, #0x63
              svc = b"\x01\x00\x00\xd4"     # svc #0
              nop = b"\x1f\x20\x03\xd5"     # nop

              count = 0
              with tarfile.open(tar_path, "r") as tin:
                  members = tin.getmembers()
                  with tarfile.open(tar_path + ".tmp", "w") as tout:
                      for m in members:
                          f = tin.extractfile(m) if m.isreg() else None
                          if f and "ld-linux" in m.name:
                              data = bytearray(f.read())
                              idx = data.find(pattern)
                              if idx != -1:
                                  sub = data[idx:idx+64]
                                  s_idx = sub.find(svc)
                                  if s_idx != -1:
                                      target = idx + s_idx
                                      data[target:target+4] = nop
                                      print(f"Patched {m.name} at 0x{target:x}!")
                                      count += 1
                              m.size = len(data)
                              tout.addfile(m, io.BytesIO(data))
                          elif f:
                              tout.addfile(m, f)
                          else:
                              tout.addfile(m)
              os.replace(tar_path + ".tmp", tar_path)
              print(f"Finished patching {tar_path}: {count} occurrences patched.")

          if os.path.exists("app/src/main/assets/bootstrap-arm64.tar"):
              patch_tar_ld("app/src/main/assets/bootstrap-arm64.tar")
          if os.path.exists("app/src/main/assets/bootstrap-arm.tar"):
              patch_tar_ld("app/src/main/assets/bootstrap-arm.tar")
          EOF

          ls -lh app/src/main/assets/

      - name: Build Release APKs
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Prepare and Verify Signed APKs
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          
          mkdir -p release-apks

          ARM64_RAW=$(find app/build/outputs/apk/release -name "*arm64-v8a*.apk" | head -n 1)
          ARM32_RAW=$(find app/build/outputs/apk/release -name "*armeabi-v7a*.apk" | head -n 1)

          echo "Found 64-bit APK: $ARM64_RAW"
          echo "Found 32-bit APK: $ARM32_RAW"

          # Sign or copy 64-bit
          if $APKSIGNER verify "$ARM64_RAW" >/dev/null 2>&1; then
            cp "$ARM64_RAW" release-apks/Cortex-arm64-v8a-signed.apk
          else
            $APKSIGNER sign \
              --ks app/cortex-release.keystore \
              --ks-pass pass:cortexpassword \
              --key-pass pass:cortexpassword \
              --out release-apks/Cortex-arm64-v8a-signed.apk \
              "$ARM64_RAW"
          fi

          # Sign or copy 32-bit
          if $APKSIGNER verify "$ARM32_RAW" >/dev/null 2>&1; then
            cp "$ARM32_RAW" release-apks/Cortex-armeabi-v7a-signed.apk
          else
            $APKSIGNER sign \
              --ks app/cortex-release.keystore \
              --ks-pass pass:cortexpassword \
              --key-pass pass:cortexpassword \
              --out release-apks/Cortex-armeabi-v7a-signed.apk \
              "$ARM32_RAW"
          fi

          # Verify Signatures
          $APKSIGNER verify release-apks/Cortex-arm64-v8a-signed.apk
          $APKSIGNER verify release-apks/Cortex-armeabi-v7a-signed.apk

          echo "APKs signed and verified successfully."

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cortex-release-apks
          path: release-apks/*.apk

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          fi

          NOTES="Cortex Release $VERSION

          Signed Android Release Packages:
          - Cortex-arm64-v8a-signed.apk (64-bit ARM devices)
          - Cortex-armeabi-v7a-signed.apk (32-bit ARM devices)

          Features:
          - Native Linux PTY execution without root
          - Zero-overhead LD_PRELOAD path redirection (no PRoot ptrace penalty)
          - Full ANSI/256-color terminal support
          - Extra keys toolbar and multi-tab session management"

          gh release create "$VERSION" \
            release-apks/Cortex-arm64-v8a-signed.apk \
            release-apks/Cortex-armeabi-v7a-signed.apk \
            --title "Cortex Release $VERSION" \
            --notes "$NOTES"
