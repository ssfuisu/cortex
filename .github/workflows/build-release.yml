name: Build and Release Cortex APKs

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Cache Android NDK and CMake
        uses: actions/cache@v4
        id: cache-ndk
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/26.1.10909125
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: ndk-26.1.10909125-cmake-3.22.1

      - name: Install Android NDK and CMake
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Gradle Wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar || gradle wrapper --gradle-version 8.7 || true
          fi
          chmod +x gradlew

      - name: Verify or Generate Release Signing Key
        run: |
          if [ ! -f app/cortex-release.keystore ]; then
            echo "Generating release signing keystore..."
            keytool -genkeypair -v \
              -keystore app/cortex-release.keystore \
              -alias cortex \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass cortexpassword \
              -keypass cortexpassword \
              -dname "CN=Cortex, OU=Terminal, O=Cortex, C=US"
          else
            echo "Committed permanent release keystore found, using existing keystore."
          fi

      - name: Build Glibc cortex-hook Libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf libc6-dev-arm64-cross libc6-dev-armhf-cross dpkg-dev
          mkdir -p hook-libs
          aarch64-linux-gnu-gcc -std=gnu11 -shared -fPIC -O3 -Wall -Wno-nonnull-compare -o hook-libs/libcortex-hook-arm64.so app/src/main/cpp/cortex-hook.c -ldl
          arm-linux-gnueabihf-gcc -std=gnu11 -shared -fPIC -O3 -Wall -Wno-nonnull-compare -o hook-libs/libcortex-hook-arm.so app/src/main/cpp/cortex-hook.c -ldl

          echo "Verifying Glibc version requirements in hook libraries..."
          if readelf -V hook-libs/*.so | grep -E "GLIBC_2\.(3[7-9]|[4-9][0-9])"; then
            echo "ERROR: libcortex-hook.so requires GLIBC version higher than 2.36!"
            exit 1
          fi
          echo "All hook libraries verified: fully compatible with Debian 12 Bookworm (glibc <= 2.36)."

      - name: Bundle Debian Glibc Minimal Bootstrap into APK
        run: |
          mkdir -p app/src/main/assets

          cp hook-libs/libcortex-hook-arm64.so app/src/main/assets/libcortex-hook-arm64.so
          cp hook-libs/libcortex-hook-arm.so app/src/main/assets/libcortex-hook-arm.so

          echo "Preparing dpkg tables, APT sandbox, hosts, and DNS config for bootstrap..."
          mkdir -p extra-rootfs/usr/share/dpkg extra-rootfs/etc/apt/apt.conf.d extra-rootfs/var/cache/apt/archives/partial extra-rootfs/var/lib/apt/lists/partial extra-rootfs/tmp extra-rootfs/etc extra-rootfs/etc/dpkg/dpkg.cfg.d extra-rootfs/etc/profile.d extra-rootfs/usr/sbin extra-rootfs/etc/ssl/certs
          curl -sLo extra-rootfs/etc/ssl/certs/ca-certificates.crt https://curl.se/ca/cacert.pem || true
          if [ -d /usr/share/dpkg ]; then
            cp -r /usr/share/dpkg/* extra-rootfs/usr/share/dpkg/
          fi
          if [ -f extra-rootfs/usr/share/dpkg/tupletable ]; then
            cp extra-rootfs/usr/share/dpkg/tupletable extra-rootfs/usr/share/dpkg/triplettable
          fi
          printf 'APT::Sandbox::User "root";\nAPT::Sandbox::Seccomp "false";\nAcquire::ForceIPv4 "true";\nAcquire::Connect::AddrConfig "false";\nAcquire::SRV "false";\nAcquire::Languages "none";\nAcquire::GzipIndexes "true";\nDir::dpkg::cputable "/usr/share/dpkg/cputable";\nDir::dpkg::tupletable "/usr/share/dpkg/tupletable";\nDir::dpkg::triplettable "/usr/share/dpkg/triplettable";\nDPkg::Install::Recursive "false";\nDpkg::Progress-Fancy "false";\nAPT::Color "false";\nDPkg::Options {\n   "--force-confdef";\n   "--force-confold";\n   "--force-unsafe-io";\n};\n' > extra-rootfs/etc/apt/apt.conf.d/01sandbox
          echo "# Disabled for Cortex" > extra-rootfs/etc/apt/apt.conf.d/docker-clean
          printf 'force-confdef\nforce-confold\nforce-unsafe-io\nno-debsig\n' > extra-rootfs/etc/dpkg/dpkg.cfg.d/01cortex
          printf 'export DPKG_DEB_THREADS_MAX=1\nexport XZ_OPT=-T1\nexport XZ_DEFAULTS=-T1\nexport TAR_OPTIONS=--no-same-owner\nexport DEBIAN_FRONTEND=noninteractive\nexport DEBCONF_FRONTEND=noninteractive\nexport DEBCONF_NONINTERACTIVE_SEEN=true\nexport SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt\nexport CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt\n' > extra-rootfs/etc/profile.d/01cortex.sh

          printf '#!/bin/sh\nexit 101\n' > extra-rootfs/usr/sbin/policy-rc.d
          printf '#!/bin/sh\nexit 0\n' > extra-rootfs/usr/sbin/ldconfig
          printf '#!/bin/sh\nexit 0\n' > extra-rootfs/usr/sbin/start-stop-daemon
          chmod 0755 extra-rootfs/usr/sbin/*

          printf '127.0.0.1 localhost localhost.localdomain\n::1 localhost ip6-localhost ip6-loopback\n151.101.130.132 deb.debian.org\n151.101.2.132 deb.debian.org\n151.101.66.132 deb.debian.org\n151.101.194.132 deb.debian.org\n151.101.130.132 security.debian.org\n151.101.2.132 security.debian.org\n151.101.66.132 security.debian.org\n151.101.194.132 security.debian.org\n151.101.130.132 cdn-fastly.deb.debian.org\n151.101.2.132 cdn-fastly.deb.debian.org\n' > extra-rootfs/etc/hosts
          printf 'nameserver 8.8.8.8\nnameserver 1.1.1.1\noptions timeout:1 attempts:2 rotate\n' > extra-rootfs/etc/resolv.conf
          printf 'passwd:         files\ngroup:          files\nshadow:         files\ngshadow:        files\n\nhosts:          files dns\nnetworks:       files\n\nprotocols:      db files\nservices:       db files\nethers:         db files\nrpc:            db files\n' > extra-rootfs/etc/nsswitch.conf

          echo "Preparing 64-bit Debian Glibc minimal bootstrap..."
          docker pull --platform linux/arm64 debian:bookworm-slim
          CID_64=$(docker create --platform linux/arm64 debian:bookworm-slim)
          docker cp hook-libs/libcortex-hook-arm64.so "$CID_64":/usr/lib/libcortex-hook.so
          docker cp extra-rootfs/. "$CID_64":/
          docker export "$CID_64" > app/src/main/assets/bootstrap-arm64.tar
          docker rm "$CID_64"

          echo "Preparing 32-bit Debian Glibc minimal bootstrap..."
          docker pull --platform linux/arm/v7 debian:bookworm-slim
          CID_32=$(docker create --platform linux/arm/v7 debian:bookworm-slim)
          docker cp hook-libs/libcortex-hook-arm.so "$CID_32":/usr/lib/libcortex-hook.so
          docker cp extra-rootfs/. "$CID_32":/
          docker export "$CID_32" > app/src/main/assets/bootstrap-arm.tar
          docker rm "$CID_32"

          echo "Patching dynamic linkers in bootstrap archives for Android seccomp compliance..."
          python3 - << 'EOF'
          import tarfile, io, os

          def patch_tar_ld(tar_path):
              print(f"Checking and patching dynamic linkers and libc in {tar_path}...")
              pattern = b"\x68\x0c\x80\xd2" # mov x8, #0x63
              svc = b"\x01\x00\x00\xd4"     # svc #0
              nop = b"\x1f\x20\x03\xd5"     # nop

              count = 0
              with tarfile.open(tar_path, "r") as tin:
                  members = tin.getmembers()
                  with tarfile.open(tar_path + ".tmp", "w") as tout:
                      for m in members:
                          if m.issym() and m.linkname.startswith("/"):
                              parent = os.path.dirname(m.name)
                              target = m.linkname.lstrip("/")
                              rel = os.path.relpath(target, parent)
                              m.linkname = rel
                          f = tin.extractfile(m) if m.isreg() else None
                          if f and ("ld-linux" in m.name or "libc.so" in m.name or "libc-" in m.name):
                              data = bytearray(f.read())
                              pos = 0
                              file_patched = 0
                              while True:
                                  idx = data.find(pattern, pos)
                                  if idx == -1: break
                                  sub = data[idx:idx+64]
                                  s_idx = sub.find(svc)
                                  if s_idx != -1:
                                      target = idx + s_idx
                                      data[target:target+4] = nop
                                      file_patched += 1
                                      count += 1
                                  pos = idx + 4
                              if file_patched > 0:
                                  print(f"Patched {m.name}: {file_patched} occurrence(s) replaced with nop!")
                              m.size = len(data)
                              tout.addfile(m, io.BytesIO(data))
                          elif f:
                              tout.addfile(m, f)
                          else:
                              tout.addfile(m)
              os.replace(tar_path + ".tmp", tar_path)
              print(f"Finished patching {tar_path}: {count} occurrences patched.")

          if os.path.exists("app/src/main/assets/bootstrap-arm64.tar"):
              patch_tar_ld("app/src/main/assets/bootstrap-arm64.tar")
          if os.path.exists("app/src/main/assets/bootstrap-arm.tar"):
              patch_tar_ld("app/src/main/assets/bootstrap-arm.tar")
          EOF

          ls -lh app/src/main/assets/

      - name: Build Release APKs
        run: |
          ./gradlew assembleRelease --build-cache --parallel --stacktrace

      - name: Prepare and Verify Signed APKs
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          
          mkdir -p release-apks

          ARM64_RAW=$(find app/build/outputs/apk/release -name "*arm64-v8a*.apk" | head -n 1)
          ARM32_RAW=$(find app/build/outputs/apk/release -name "*armeabi-v7a*.apk" | head -n 1)

          echo "Found 64-bit APK: $ARM64_RAW"
          echo "Found 32-bit APK: $ARM32_RAW"

          # Sign or copy 64-bit
          if $APKSIGNER verify "$ARM64_RAW" >/dev/null 2>&1; then
            cp "$ARM64_RAW" release-apks/Cortex-arm64-v8a-signed.apk
          else
            $APKSIGNER sign \
              --ks app/cortex-release.keystore \
              --ks-pass pass:cortexpassword \
              --key-pass pass:cortexpassword \
              --out release-apks/Cortex-arm64-v8a-signed.apk \
              "$ARM64_RAW"
          fi

          # Sign or copy 32-bit
          if $APKSIGNER verify "$ARM32_RAW" >/dev/null 2>&1; then
            cp "$ARM32_RAW" release-apks/Cortex-armeabi-v7a-signed.apk
          else
            $APKSIGNER sign \
              --ks app/cortex-release.keystore \
              --ks-pass pass:cortexpassword \
              --key-pass pass:cortexpassword \
              --out release-apks/Cortex-armeabi-v7a-signed.apk \
              "$ARM32_RAW"
          fi

          # Verify Signatures
          $APKSIGNER verify release-apks/Cortex-arm64-v8a-signed.apk
          $APKSIGNER verify release-apks/Cortex-armeabi-v7a-signed.apk

          echo "APKs signed and verified successfully."

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cortex-release-apks
          path: release-apks/*.apk

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OFFSET=$(( ${{ github.run_number }} - 34 ))
          if [ "$OFFSET" -lt 0 ]; then OFFSET=0; fi
          VERSION="v1.24.${OFFSET}"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          fi

          NOTES="Cortex Release $VERSION

          Features and Improvements:
          - Accurate Local Timezone Clock: Auto-detects device timezone offset and sets both POSIX TZ and binary /etc/localtime TZif so date command and timedate tools display the exact local phone time.
          - AWK and Which Direct Binary Guarantee: Directly copies mawk and which into /usr/bin, /bin, and ~/.local/bin as real executable ELF binaries, resolving awk command not found errors during nvm install --lts.
          - Native source and reload Support: Sourcing ~/.bashrc or bashrc now executes bash native source with zero positional arguments, immediately loading newly installed tools into the current session.
          - Status Bar Notification Icon: Restructured notification icon silhouette with evenOdd fillType to ensure the Cortex terminal icon displays clearly on the Android notification bar and lock screen.
          - OpenCode and Modern CLI Support: Seamless rootfs working directory mapping for Node, Bun, Zig, Python, and Go developer tools.
          - Permanent Keystore Signature: Uses permanent release key for seamless application updates.
          - Retained All Previous Releases: Older releases remain available alongside new releases."

          gh release create "$VERSION" \
            release-apks/Cortex-arm64-v8a-signed.apk \
            release-apks/Cortex-armeabi-v7a-signed.apk \
            --title "Cortex Release $VERSION" \
            --notes "$NOTES"
