name: Build and Release Cortex APKs

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK Licenses
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true

      - name: Cache Android NDK and CMake
        uses: actions/cache@v4
        id: cache-ndk
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/26.1.10909125
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: ndk-26.1.10909125-cmake-3.22.1

      - name: Install Android NDK and CMake
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Setup Release Signing Key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Restoring release keystore from secrets..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/cortex-release.keystore
          elif [ -f app/cortex-release.keystore ]; then
            echo "Existing keystore found on disk."
          else
            echo "No release keystore secret configured; assembleRelease will use debug fallback for unauthenticated builds."
          fi

      - name: Cache cortex-hook Libraries
        uses: actions/cache@v4
        id: cache-hook
        with:
          path: hook-libs
          key: cortex-hook-${{ hashFiles('app/src/main/cpp/cortex-hook.c') }}

      - name: Build Glibc cortex-hook Libraries
        if: steps.cache-hook.outputs.cache-hit != 'true'
        run: |
          sudo rm -f /etc/apt/sources.list.d/*google* /etc/apt/sources.list.d/*chrome*
          sudo apt-get update -o Acquire::Retries=3 -qq || true
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf libc6-dev-arm64-cross libc6-dev-armhf-cross dpkg-dev
          mkdir -p hook-libs
          aarch64-linux-gnu-gcc -std=gnu11 -shared -fPIC -O3 -Wall -Wno-nonnull-compare -Wl,-z,max-page-size=16384 -o hook-libs/libcortex-hook-arm64.so app/src/main/cpp/cortex-hook.c -ldl
          arm-linux-gnueabihf-gcc -std=gnu11 -shared -fPIC -O3 -Wall -Wno-nonnull-compare -Wl,-z,max-page-size=16384 -o hook-libs/libcortex-hook-arm.so app/src/main/cpp/cortex-hook.c -ldl

          echo "Verifying Glibc version requirements in hook libraries..."
          if readelf -V hook-libs/*.so | grep -E "GLIBC_2\.([4-9][0-9])"; then
            echo "ERROR: libcortex-hook.so requires GLIBC version higher than 2.39!"
            exit 1
          fi
          echo "All hook libraries verified: fully compatible with Ubuntu 24.04 LTS (glibc <= 2.39)."

      - name: Cache Prepared Ubuntu Bootstrap Archives
        uses: actions/cache@v4
        id: cache-bootstrap
        with:
          path: |
            app/src/main/assets/bootstrap-arm64.tar.gz
            app/src/main/assets/bootstrap-arm.tar.gz
            app/src/main/assets/cacert.pem
          key: bootstrap-rootfs-v4-${{ hashFiles('scripts/setup-extra-rootfs.sh', 'app/src/main/cpp/cortex-hook.c', '.github/workflows/build-release.yml') }}

      - name: Set up QEMU for multi-arch containers
        if: steps.cache-bootstrap.outputs.cache-hit != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Bundle Ubuntu 24.04 LTS Glibc Bootstrap into APK
        run: |
          mkdir -p app/src/main/assets

          cp hook-libs/libcortex-hook-arm64.so app/src/main/assets/libcortex-hook-arm64.so
          cp hook-libs/libcortex-hook-arm.so app/src/main/assets/libcortex-hook-arm.so

          if [ "${{ steps.cache-bootstrap.outputs.cache-hit }}" = "true" ] && [ -f app/src/main/assets/bootstrap-arm64.tar.gz ] && [ -f app/src/main/assets/bootstrap-arm.tar.gz ]; then
            echo "Using cached pre-built Ubuntu bootstrap archives. Skipping rootfs generation."
          else
            echo "Preparing dpkg tables, APT sandbox, hosts, and DNS config for bootstrap..."
          mkdir -p extra-rootfs/usr/share/dpkg extra-rootfs/etc/apt/apt.conf.d extra-rootfs/var/cache/apt/archives/partial extra-rootfs/var/lib/apt/lists/partial extra-rootfs/tmp extra-rootfs/etc extra-rootfs/etc/alternatives extra-rootfs/var/lib/dpkg/alternatives extra-rootfs/etc/dpkg/dpkg.cfg.d extra-rootfs/etc/profile.d extra-rootfs/usr/sbin extra-rootfs/etc/ssl/certs
          curl -sSLo extra-rootfs/etc/ssl/certs/ca-certificates.crt https://curl.se/ca/cacert.pem
          cp extra-rootfs/etc/ssl/certs/ca-certificates.crt app/src/main/assets/cacert.pem
          mkdir -p extra-rootfs/usr/lib/ssl extra-rootfs/etc/pki/tls/certs
          cp extra-rootfs/etc/ssl/certs/ca-certificates.crt extra-rootfs/etc/ssl/cert.pem
          cp extra-rootfs/etc/ssl/certs/ca-certificates.crt extra-rootfs/usr/lib/ssl/cert.pem
          cp extra-rootfs/etc/ssl/certs/ca-certificates.crt extra-rootfs/etc/pki/tls/certs/ca-bundle.crt
          mkdir -p extra-rootfs/usr/share/keyrings extra-rootfs/etc/apt/keyrings extra-rootfs/etc/apt/trusted.gpg.d extra-rootfs/etc/gnupg extra-rootfs/home/.gnupg extra-rootfs/root/.gnupg
          if [ -d /usr/share/keyrings ]; then
            cp -r /usr/share/keyrings/* extra-rootfs/usr/share/keyrings/ 2>/dev/null || true
          fi
          cp app/src/main/assets/*.gpg extra-rootfs/usr/share/keyrings/ 2>/dev/null || true
          if [ -f extra-rootfs/usr/share/keyrings/ubuntu-archive-keyring.gpg ]; then
            cp extra-rootfs/usr/share/keyrings/ubuntu-archive-keyring.gpg extra-rootfs/etc/apt/keyrings/ubuntu-archive-keyring.gpg 2>/dev/null || true
            cp extra-rootfs/usr/share/keyrings/ubuntu-archive-keyring.gpg extra-rootfs/etc/apt/trusted.gpg 2>/dev/null || true
            cp extra-rootfs/usr/share/keyrings/ubuntu-archive-keyring.gpg extra-rootfs/etc/apt/trusted.gpg.d/ubuntu-archive-keyring.gpg 2>/dev/null || true
            cp extra-rootfs/usr/share/keyrings/ubuntu-archive-keyring.gpg extra-rootfs/etc/gnupg/trustedkeys.gpg 2>/dev/null || true
            cp extra-rootfs/usr/share/keyrings/ubuntu-archive-keyring.gpg extra-rootfs/home/.gnupg/trustedkeys.gpg 2>/dev/null || true
            cp extra-rootfs/usr/share/keyrings/ubuntu-archive-keyring.gpg extra-rootfs/root/.gnupg/trustedkeys.gpg 2>/dev/null || true
          fi
          if [ -d /usr/share/dpkg ]; then
            cp -r /usr/share/dpkg/* extra-rootfs/usr/share/dpkg/
          fi
          if [ -d /usr/share/zoneinfo ]; then
            mkdir -p extra-rootfs/usr/share
            cp -r /usr/share/zoneinfo extra-rootfs/usr/share/
          fi
          printf 'APT::Sandbox::User "root";\nAPT::Sandbox::Seccomp "false";\nAcquire::ForceIPv4 "true";\nAcquire::Connect::AddrConfig "false";\nAcquire::SRV "false";\nAcquire::Languages "none";\nAcquire::GzipIndexes "true";\nDir::dpkg::cputable "/usr/share/dpkg/cputable";\nDir::dpkg::tupletable "/usr/share/dpkg/tupletable";\nDir::dpkg::triplettable "/usr/share/dpkg/triplettable";\nDPkg::Install::Recursive "false";\nDpkg::Progress-Fancy "false";\nAPT::Color "false";\nDPkg::Options {\n   "--force-confdef";\n   "--force-confold";\n   "--force-unsafe-io";\n};\n' > extra-rootfs/etc/apt/apt.conf.d/01sandbox
          mkdir -p extra-rootfs/etc/apt/sources.list.d
          rm -f extra-rootfs/etc/apt/sources.list
          printf 'Types: deb\nURIs: https://ports.ubuntu.com/ubuntu-ports/\nSuites: noble noble-updates noble-backports\nComponents: main restricted universe multiverse\nSigned-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg\n\nTypes: deb\nURIs: https://ports.ubuntu.com/ubuntu-ports/\nSuites: noble-security\nComponents: main restricted universe multiverse\nSigned-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg\n' > extra-rootfs/etc/apt/sources.list.d/ubuntu.sources
          chmod 0644 extra-rootfs/etc/apt/sources.list.d/ubuntu.sources
          echo "# Disabled for Cortex" > extra-rootfs/etc/apt/apt.conf.d/docker-clean
          mkdir -p extra-rootfs/etc/apt/preferences.d
          printf 'Explanation: Pin core glibc and linker packages to prevent upgrading to stock upstream packages that fail Android SECCOMP\nPackage: libc6*\nPin: release *\nPin-Priority: -1\n\nPackage: libc-bin\nPin: release *\nPin-Priority: -1\n\nPackage: libc-dev-bin\nPin: release *\nPin-Priority: -1\n\nPackage: locales\nPin: release *\nPin-Priority: -1\n' > extra-rootfs/etc/apt/preferences.d/01cortex-pins
          printf 'force-confdef\nforce-confold\nforce-unsafe-io\nno-debsig\n' > extra-rootfs/etc/dpkg/dpkg.cfg.d/01cortex
          printf 'export DPKG_DEB_THREADS_MAX=1\nexport XZ_OPT=-T1\nexport XZ_DEFAULTS=-T1\nexport TAR_OPTIONS=--no-same-owner\nexport DEBIAN_FRONTEND=noninteractive\nexport DEBCONF_FRONTEND=noninteractive\nexport DEBCONF_NONINTERACTIVE_SEEN=true\nunset PREFIX\nexport GODEBUG=netdns=cgo\nshopt -s checkwinsize 2>/dev/null\nexport PATH="/home/.opencode/bin:/home/.local/bin:$HOME/.opencode/bin:$HOME/.local/bin:$PATH"\nif [ -n "$CORTEX_ROOT" ]; then\n  export SSL_CERT_FILE="$CORTEX_ROOT/etc/ssl/certs/ca-certificates.crt"\n  export SSL_CERT_DIR="$CORTEX_ROOT/etc/ssl/certs:/system/etc/security/cacerts"\n  export CURL_CA_BUNDLE="$CORTEX_ROOT/etc/ssl/certs/ca-certificates.crt"\n  export NODE_EXTRA_CA_CERTS="$CORTEX_ROOT/etc/ssl/certs/ca-certificates.crt"\n  export REQUESTS_CA_BUNDLE="$CORTEX_ROOT/etc/ssl/certs/ca-certificates.crt"\nelse\n  export SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt\n  export CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt\nfi\nexport TZDIR=/usr/share/zoneinfo\npython3 -c "import glob, os; [os.remove(f) for f in glob.glob(\"/var/lib/apt/lists/*_Packages\") if any(b and not b.startswith(b\"Package:\") for b in [x.strip() for x in open(f, \"rb\").read().split(b\"\\n\\n\")])]\" 2>/dev/null || true\nrm -rf /var/lib/apt/lists/partial/* 2>/dev/null || true\nif [ -d /etc/cortex/autostart ]; then\n  for s in /etc/cortex/autostart/*; do\n    if [ -f "$s" ]; then\n      sname="$(basename "$s")"\n      service "$sname" start >/dev/null 2>&1 || true\n    fi\n  done\nfi\n' > extra-rootfs/etc/profile.d/01cortex.sh

          printf '#!/bin/sh\nexit 101\n' > extra-rootfs/usr/sbin/policy-rc.d
          printf '#!/bin/sh\nexit 0\n' > extra-rootfs/usr/sbin/ldconfig
          printf '#!/bin/sh\nexit 0\n' > extra-rootfs/usr/sbin/start-stop-daemon
          mkdir -p extra-rootfs/usr/sbin extra-rootfs/usr/bin
          MAINT_TOOLS="systemd-machine-id-setup systemd-sysusers systemd-tmpfiles mandb update-mime-database update-desktop-database install-info install-sgmlcatalog"
          for tool in $MAINT_TOOLS; do
            printf '#!/bin/sh\nexit 0\n' > extra-rootfs/usr/sbin/$tool
            printf '#!/bin/sh\nexit 0\n' > extra-rootfs/usr/bin/$tool
            chmod 0755 extra-rootfs/usr/sbin/$tool extra-rootfs/usr/bin/$tool
          done
          mkdir -p extra-rootfs/boot extra-rootfs/media extra-rootfs/mnt extra-rootfs/srv extra-rootfs/opt extra-rootfs/run extra-rootfs/tmp
          chmod 0755 extra-rootfs/boot extra-rootfs/media extra-rootfs/mnt extra-rootfs/srv extra-rootfs/opt extra-rootfs/usr/sbin/*
          printf 'root:x:0:\ndaemon:x:1:\ncortex:x:0:\n' > extra-rootfs/etc/group
          printf 'root:x:0:0:root:/home:/bin/bash\ncortex:x:0:0:Cortex:/home:/bin/bash\n' > extra-rootfs/etc/passwd
          bash scripts/setup-extra-rootfs.sh
          rm -rf extra-rootfs/dev extra-rootfs/bin extra-rootfs/sbin 2>/dev/null || true

          printf '127.0.0.1 localhost localhost.localdomain\n::1 localhost ip6-localhost ip6-loopback\n' > extra-rootfs/etc/hosts
          printf 'nameserver 8.8.8.8\nnameserver 1.1.1.1\noptions timeout:1 attempts:2 rotate\n' > extra-rootfs/etc/resolv.conf
          printf 'passwd:         files\ngroup:          files\nshadow:         files\ngshadow:        files\n\nhosts:          files dns\nnetworks:       files\n\nprotocols:      db files\nservices:       db files\nethers:         db files\nrpc:            db files\n' > extra-rootfs/etc/nsswitch.conf

          echo "Preparing 64-bit Ubuntu 24.04 LTS minimal bootstrap..."
          docker pull --platform linux/arm64 ubuntu:24.04
          CID_64=$(docker create --platform linux/arm64 ubuntu:24.04 sleep 1800)
          docker cp hook-libs/libcortex-hook-arm64.so "$CID_64":/usr/lib/libcortex-hook.so
          docker cp extra-rootfs/. "$CID_64":/
          docker start "$CID_64"

          echo "Pre-updating packages and caching APT lists for ARM64..."
          docker exec -e DEBIAN_FRONTEND=noninteractive "$CID_64" apt-get update -o Acquire::Retries=3 || true
          docker exec -e DEBIAN_FRONTEND=noninteractive "$CID_64" apt-get -y --no-install-recommends upgrade || true
          docker exec "$CID_64" apt-get clean || true
          docker exec "$CID_64" rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock* /var/cache/apt/archives/lock 2>/dev/null || true
          docker exec "$CID_64" rm -rf /var/cache/apt/archives/*.deb /tmp/* 2>/dev/null || true

          docker stop "$CID_64"
          docker export "$CID_64" > app/src/main/assets/bootstrap-arm64.tar
          docker rm -f "$CID_64"

          echo "Preparing 32-bit Ubuntu 24.04 LTS minimal bootstrap..."
          docker pull --platform linux/arm/v7 ubuntu:24.04
          CID_32=$(docker create --platform linux/arm/v7 ubuntu:24.04 sleep 1800)
          docker cp hook-libs/libcortex-hook-arm.so "$CID_32":/usr/lib/libcortex-hook.so
          docker cp extra-rootfs/. "$CID_32":/
          docker start "$CID_32"

          echo "Pre-updating packages and caching APT lists for ARMv7..."
          docker exec -e DEBIAN_FRONTEND=noninteractive "$CID_32" apt-get update -o Acquire::Retries=3 || true
          docker exec -e DEBIAN_FRONTEND=noninteractive "$CID_32" apt-get -y --no-install-recommends upgrade || true
          docker exec "$CID_32" apt-get clean || true
          docker exec "$CID_32" rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock* /var/cache/apt/archives/lock 2>/dev/null || true
          docker exec "$CID_32" rm -rf /var/cache/apt/archives/*.deb /tmp/* 2>/dev/null || true

          docker stop "$CID_32"
          docker export "$CID_32" > app/src/main/assets/bootstrap-arm.tar
          docker rm -f "$CID_32"

          echo "Patching dynamic linkers in bootstrap archives for Android seccomp compliance..."
          python3 - << 'EOF'
          import tarfile, io, os, struct

          def patch_elf_bytes(data, filename):
              if len(data) < 52 or data[:4] != b"\x7fELF":
                  return data, 0
              ei_class = data[4]
              ei_data = data[5]
              if ei_data != 1:  # Only Little Endian is supported
                  return data, 0
              e_machine = struct.unpack_from("<H", data, 18)[0]
              EM_ARM = 40
              EM_AARCH64 = 183
              if e_machine not in (EM_ARM, EM_AARCH64):
                  return data, 0

              segments = []
              if ei_class == 2:  # 64-bit ELF
                  if len(data) >= 64:
                      e_phoff = struct.unpack_from("<Q", data, 32)[0]
                      e_phentsize = struct.unpack_from("<H", data, 54)[0]
                      e_phnum = struct.unpack_from("<H", data, 56)[0]
                      for i in range(e_phnum):
                          off = e_phoff + i * e_phentsize
                          if off + 40 > len(data): break
                          p_type, p_flags = struct.unpack_from("<II", data, off)
                          p_offset = struct.unpack_from("<Q", data, off + 8)[0]
                          p_filesz = struct.unpack_from("<Q", data, off + 32)[0]
                          if p_type == 1 and (p_flags & 1):  # PT_LOAD and PF_X
                              segments.append((p_offset, p_offset + p_filesz))
                      if not segments:
                          e_shoff = struct.unpack_from("<Q", data, 40)[0]
                          e_shentsize = struct.unpack_from("<H", data, 58)[0]
                          e_shnum = struct.unpack_from("<H", data, 60)[0]
                          for i in range(e_shnum):
                              off = e_shoff + i * e_shentsize
                              if off + 48 > len(data): break
                              sh_flags = struct.unpack_from("<Q", data, off + 8)[0]
                              sh_offset = struct.unpack_from("<Q", data, off + 24)[0]
                              sh_size = struct.unpack_from("<Q", data, off + 32)[0]
                              if sh_flags & 4:  # SHF_EXECINSTR
                                  segments.append((sh_offset, sh_offset + sh_size))
              elif ei_class == 1:  # 32-bit ELF
                  if len(data) >= 52:
                      e_phoff = struct.unpack_from("<I", data, 28)[0]
                      e_phentsize = struct.unpack_from("<H", data, 42)[0]
                      e_phnum = struct.unpack_from("<H", data, 44)[0]
                      for i in range(e_phnum):
                          off = e_phoff + i * e_phentsize
                          if off + 28 > len(data): break
                          p_type = struct.unpack_from("<I", data, off)[0]
                          p_offset = struct.unpack_from("<I", data, off + 4)[0]
                          p_filesz = struct.unpack_from("<I", data, off + 16)[0]
                          p_flags = struct.unpack_from("<I", data, off + 24)[0]
                          if p_type == 1 and (p_flags & 1):  # PT_LOAD and PF_X
                              segments.append((p_offset, p_offset + p_filesz))
                      if not segments:
                          e_shoff = struct.unpack_from("<I", data, 32)[0]
                          e_shentsize = struct.unpack_from("<H", data, 46)[0]
                          e_shnum = struct.unpack_from("<H", data, 48)[0]
                          for i in range(e_shnum):
                              off = e_shoff + i * e_shentsize
                              if off + 24 > len(data): break
                              sh_flags = struct.unpack_from("<I", data, off + 8)[0]
                              sh_offset = struct.unpack_from("<I", data, off + 16)[0]
                              sh_size = struct.unpack_from("<I", data, off + 20)[0]
                              if sh_flags & 4:  # SHF_EXECINSTR
                                  segments.append((sh_offset, sh_offset + sh_size))

              if not segments:
                  return data, 0

              patched_count = 0
              if e_machine == EM_AARCH64:
                  svc = b"\x01\x00\x00\xd4"          # svc #0
                  nop = b"\x1f\x20\x03\xd5"          # nop
                  mov_enosys = b"\xa0\x04\x80\x92"   # mov x0, #-38
                  patches = [
                      ("set_robust_list", b"\x68\x0c\x80\xd2", nop),        # mov x8, #0x63 (99) -> nop
                      ("clone3",          b"\x68\x36\x80\xd2", mov_enosys), # mov x8, #0x1b3 (435) -> mov x0, #-38
                      ("rseq",            b"\xa8\x24\x80\xd2", mov_enosys), # mov x8, #0x125 (293) -> mov x0, #-38
                  ]
                  for seg_start, seg_end in segments:
                      seg_start = max(0, seg_start)
                      seg_end = min(len(data), seg_end)
                      start_aligned = (seg_start + 3) & ~3
                      end_aligned = seg_end & ~3
                      for pos in range(start_aligned, end_aligned - 4, 4):
                          for sc_name, pat, repl in patches:
                              if data[pos:pos+4] == pat:
                                  for s_pos in range(pos + 4, min(end_aligned, pos + 68), 4):
                                      if data[s_pos:s_pos+4] == svc:
                                          data[s_pos:s_pos+4] = repl
                                          patched_count += 1
                                          print(f"Patched AArch64 {sc_name} at 0x{s_pos:x} in {filename}")
                                          break
              elif e_machine == EM_ARM:
                  svc_arm = b"\x00\x00\x00\xef"        # svc #0 in ARM mode
                  nop_arm = b"\x00\xf0\x20\xe3"        # nop in ARM mode
                  mov_enosys_arm = b"\x25\x00\xe0\xe3" # mvn r0, #37 (-38)
                  patches_arm = [
                      ("set_robust_list", b"\x52\x71\x00\xe3", nop_arm),        # movw r7, #0x152 (338)
                      ("clone3",          b"\xb3\x71\x00\xe3", mov_enosys_arm), # movw r7, #0x1b3 (435)
                      ("rseq",            b"\x8e\x71\x00\xe3", mov_enosys_arm), # movw r7, #0x18e (398)
                  ]
                  for seg_start, seg_end in segments:
                      seg_start = max(0, seg_start)
                      seg_end = min(len(data), seg_end)
                      start_aligned = (seg_start + 3) & ~3
                      end_aligned = seg_end & ~3
                      for pos in range(start_aligned, end_aligned - 4, 4):
                          for sc_name, pat, repl in patches_arm:
                              if data[pos:pos+4] == pat:
                                  for s_pos in range(pos + 4, min(end_aligned, pos + 68), 4):
                                      if data[s_pos:s_pos+4] == svc_arm:
                                          data[s_pos:s_pos+4] = repl
                                          patched_count += 1
                                          print(f"Patched ARM {sc_name} at 0x{s_pos:x} in {filename}")
                                          break

              return data, patched_count

          def patch_tar_ld(tar_path):
              print(f"Checking and patching dynamic linkers and libc in {tar_path}...")
              count = 0
              with tarfile.open(tar_path, "r") as tin:
                  members = tin.getmembers()
                  with tarfile.open(tar_path + ".tmp", "w") as tout:
                      for m in members:
                          if m.name == "home/ubuntu" or m.name.startswith("home/ubuntu/"):
                              continue
                          if m.name in ["home/bashrc", "home/profile"]:
                              continue
                          if m.issym() and m.linkname.startswith("/"):
                              parent = os.path.dirname(m.name)
                              target = m.linkname.lstrip("/")
                              rel = os.path.relpath(target, parent)
                              m.linkname = rel
                          f = tin.extractfile(m) if m.isreg() else None
                          if f and m.name == "var/lib/dpkg/status":
                              status_data = f.read().decode("utf-8", errors="replace")
                              packages_to_hold = {"libc6", "libc6:arm64", "libc6:armhf", "libc-bin", "libc-dev-bin", "locales"}
                              blocks = status_data.split("\n\n")
                              new_blocks = []
                              for b in blocks:
                                  lines = b.split("\n")
                                  pkg_name = None
                                  for l in lines:
                                      if l.startswith("Package: "):
                                          pkg_name = l.split(": ", 1)[1].strip()
                                          break
                                  if pkg_name in packages_to_hold:
                                      new_lines = []
                                      has_status = False
                                      for l in lines:
                                          if l.startswith("Status: "):
                                              new_lines.append("Status: hold ok installed")
                                              has_status = True
                                          else:
                                              new_lines.append(l)
                                      if not has_status:
                                          new_lines.insert(1, "Status: hold ok installed")
                                      new_blocks.append("\n".join(new_lines))
                                  else:
                                      new_blocks.append(b)
                              mod_bytes = ("\n\n".join(new_blocks)).encode("utf-8")
                              m.size = len(mod_bytes)
                              tout.addfile(m, io.BytesIO(mod_bytes))
                              print(f"Set dpkg hold in {m.name}")
                              continue
                          if f and ("ld-linux" in m.name or "libc.so" in m.name or "libc-" in m.name):
                              data = bytearray(f.read())
                              data, file_patched = patch_elf_bytes(data, m.name)
                              if file_patched > 0:
                                  count += file_patched
                                  print(f"Total patched in {m.name}: {file_patched}")
                              m.size = len(data)
                              tout.addfile(m, io.BytesIO(data))
                          elif f:
                              tout.addfile(m, f)
                          else:
                              tout.addfile(m)
              os.replace(tar_path + ".tmp", tar_path)
              print(f"Finished patching {tar_path}: {count} occurrences patched.")

          if os.path.exists("app/src/main/assets/bootstrap-arm64.tar"):
              patch_tar_ld("app/src/main/assets/bootstrap-arm64.tar")
          if os.path.exists("app/src/main/assets/bootstrap-arm.tar"):
              patch_tar_ld("app/src/main/assets/bootstrap-arm.tar")
          EOF

          echo "Compressing bootstrap archives with max gzip compression (pigz)..."
          if command -v pigz >/dev/null 2>&1; then
            pigz -9 -f app/src/main/assets/bootstrap-arm64.tar
            pigz -9 -f app/src/main/assets/bootstrap-arm.tar
          else
            gzip -9 -f app/src/main/assets/bootstrap-arm64.tar
            gzip -9 -f app/src/main/assets/bootstrap-arm.tar
          fi
          fi

          if [ ! -f app/src/main/assets/cacert.pem ]; then
            curl -sSLo app/src/main/assets/cacert.pem https://curl.se/ca/cacert.pem
          fi

          ls -lh app/src/main/assets/

      - name: Build Release APKs
        env:
          RELEASE_KEYSTORE_PATH: app/cortex-release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --build-cache --parallel --stacktrace

      - name: Prepare and Verify Signed APKs
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"

          mkdir -p release-apks

          ARM64_RAW=$(find app/build/outputs/apk/release -name "*arm64-v8a*.apk" | head -n 1)
          ARM32_RAW=$(find app/build/outputs/apk/release -name "*armeabi-v7a*.apk" | head -n 1)

          echo "Found 64-bit APK: $ARM64_RAW"
          echo "Found 32-bit APK: $ARM32_RAW"

          # Determine keystore and signing credentials
          if [ -f app/cortex-release.keystore ] && [ -n "$RELEASE_STORE_PASSWORD" ]; then
            echo "Using release keystore for signing..."
            KS_FILE="app/cortex-release.keystore"
            KS_PASS="$RELEASE_STORE_PASSWORD"
            KEY_ALIAS="${RELEASE_KEY_ALIAS:-cortex}"
            KEY_PASS="${RELEASE_KEY_PASSWORD:-$RELEASE_STORE_PASSWORD}"
          elif [ -f "$HOME/.android/debug.keystore" ]; then
            echo "Using debug keystore fallback for signing..."
            KS_FILE="$HOME/.android/debug.keystore"
            KS_PASS="android"
            KEY_ALIAS="androiddebugkey"
            KEY_PASS="android"
          else
            echo "Searching for generated debug keystore..."
            KS_FILE=$(find "$HOME/.android" -name "debug.keystore" 2>/dev/null | head -n 1)
            if [ -z "$KS_FILE" ]; then
              echo "ERROR: Neither release nor debug keystore found."
              exit 1
            fi
            KS_PASS="android"
            KEY_ALIAS="androiddebugkey"
            KEY_PASS="android"
          fi

          # 1. Strip opposite arch assets from 64-bit APK to minimize download size
          echo "Optimizing 64-bit APK size: stripping 32-bit assets..."
          zip -d "$ARM64_RAW" "assets/bootstrap-arm.tar*" "assets/libcortex-hook-arm.so" || true
          $ZIPALIGN -f -p 4 "$ARM64_RAW" release-apks/arm64-aligned.apk
          $APKSIGNER sign \
            --ks "$KS_FILE" \
            --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASS" \
            --out release-apks/Cortex-arm64-v8a-signed.apk \
            release-apks/arm64-aligned.apk
          rm -f release-apks/arm64-aligned.apk

          # 2. Strip opposite arch assets from 32-bit APK to minimize download size
          echo "Optimizing 32-bit APK size: stripping 64-bit assets..."
          zip -d "$ARM32_RAW" "assets/bootstrap-arm64.tar*" "assets/libcortex-hook-arm64.so" || true
          $ZIPALIGN -f -p 4 "$ARM32_RAW" release-apks/arm32-aligned.apk
          $APKSIGNER sign \
            --ks "$KS_FILE" \
            --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASS" \
            --out release-apks/Cortex-armeabi-v7a-signed.apk \
            release-apks/arm32-aligned.apk
          rm -f release-apks/arm32-aligned.apk

          # Verify Signatures
          $APKSIGNER verify release-apks/Cortex-arm64-v8a-signed.apk
          $APKSIGNER verify release-apks/Cortex-armeabi-v7a-signed.apk

          echo "Final optimized APK sizes:"
          ls -lh release-apks/
          echo "APKs signed and verified successfully."

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cortex-release-apks
          path: release-apks/*.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GRADLE_VER=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$GRADLE_VER" ]; then
            GRADLE_VER="1.25.25"
          fi
          VERSION="v${GRADLE_VER#v}"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          fi

          echo "Preparing release $VERSION..."

          # Delete existing release/tag with same version if present so update succeeds cleanly
          gh release delete "$VERSION" --yes --cleanup-tag 2>/dev/null || true
          git tag -d "$VERSION" 2>/dev/null || true
          git push --delete origin "$VERSION" 2>/dev/null || true

          cat << EOFNOTES > release-notes.md
          ### Cortex Release $VERSION

          Cortex turns your Android device into a complete, native development powerhouse powered by **Ubuntu 24.04 LTS (Noble Numbat)** and **Glibc 2.39** — with **ZERO virtualization, ZERO PRoot, and ZERO containers**.

          #### Features & Assets:
          - Ultra-compact APK size with genuine Glibc 2.39 & Ubuntu 24.04 runtime.
          - Native OpenCode, Meta Muse Code, and OpenJDK 17 support.
          - High-speed native terminal emulator with hardware acceleration.

          #### Included Packages & Assets:
          - \`Cortex-arm64-v8a-signed.apk\` (64-bit ARM)
          - \`Cortex-armeabi-v7a-signed.apk\` (32-bit ARM)
          EOFNOTES

          sed -i 's/^          //' release-notes.md

          gh release create "$VERSION" \
            release-apks/Cortex-arm64-v8a-signed.apk \
            release-apks/Cortex-armeabi-v7a-signed.apk \
            --title "Cortex Release $VERSION" \
            --notes-file release-notes.md
