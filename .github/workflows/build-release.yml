name: Build and Release Cortex APKs

on:
  push:
    branches:
      - main
      - master
    # Documentation-only pushes (README, website, license) must not rebuild the APKs and re-create the
    # release of the current version. Tag pushes ignore path filters.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, sign and verify the APKs but publish nothing (tests the signing setup)"
        type: boolean
        default: false
      prerelease:
        description: "Publish the release as a pre-release: the in-app updater only offers the latest full release, so nobody is offered it until it is promoted"
        type: boolean
        default: false
      emulator_test_of_run:
        description: "Build nothing, only run the emulator test on the APKs of this earlier run of this workflow (its run ID)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build Signed APKs
    if: ${{ !inputs.emulator_test_of_run }}
    # Pinned: GitHub moves "ubuntu-latest" to Ubuntu 26.04 from 2026-10-19, and this job installs
    # Ubuntu-specific cross-compilers. Move to a newer image deliberately, after testing it.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK Licenses
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true

      - name: Cache Android NDK and CMake
        uses: actions/cache@v4
        id: cache-ndk
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/26.1.10909125
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: ndk-26.1.10909125-cmake-3.22.1

      - name: Install Android NDK and CMake
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Setup Release Signing Key
        if: github.event_name != 'pull_request'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_OLD_KEYSTORE_BASE64: ${{ secrets.RELEASE_OLD_KEYSTORE_BASE64 }}
          RELEASE_OLD_STORE_PASSWORD: ${{ secrets.RELEASE_OLD_STORE_PASSWORD }}
          RELEASE_OLD_KEY_ALIAS: ${{ secrets.RELEASE_OLD_KEY_ALIAS }}
          RELEASE_OLD_KEY_PASSWORD: ${{ secrets.RELEASE_OLD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # No fallback keys: a release must never be signed with a key that is not the project's.
          for v in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD \
                   RELEASE_OLD_KEYSTORE_BASE64 RELEASE_OLD_STORE_PASSWORD RELEASE_OLD_KEY_ALIAS RELEASE_OLD_KEY_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "ERROR: repository secret $v is not set"
              exit 1
            fi
          done
          echo "Restoring release keystores from secrets..."
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/cortex-release.keystore
          echo "$RELEASE_OLD_KEYSTORE_BASE64" | base64 -d > app/cortex-release-old.keystore
          chmod 0600 app/cortex-release.keystore app/cortex-release-old.keystore
          keytool -list -keystore app/cortex-release.keystore -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null
          keytool -list -keystore app/cortex-release-old.keystore -storepass "$RELEASE_OLD_STORE_PASSWORD" -alias "$RELEASE_OLD_KEY_ALIAS" >/dev/null
          test -s signing/cortex.lineage

      - name: Cache cortex-hook Libraries
        uses: actions/cache@v4
        id: cache-hook
        with:
          path: hook-libs
          key: cortex-hook-${{ hashFiles('app/src/main/cpp/cortex-hook.c', 'app/src/main/cpp/hook/**', 'app/src/main/cpp/root/**', '.github/workflows/build-release.yml') }}

      - name: Build Glibc cortex-hook Libraries
        if: steps.cache-hook.outputs.cache-hit != 'true'
        run: |
          sudo rm -f /etc/apt/sources.list.d/*google* /etc/apt/sources.list.d/*chrome*
          sudo apt-get update -o Acquire::Retries=3 -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf libc6-dev-arm64-cross libc6-dev-armhf-cross dpkg-dev
          mkdir -p hook-libs
          aarch64-linux-gnu-gcc -std=gnu11 -shared -fPIC -O3 -Wall -Wno-nonnull-compare -Wl,-z,max-page-size=16384 -o hook-libs/libcortex-hook-arm64.so app/src/main/cpp/cortex-hook.c -ldl
          arm-linux-gnueabihf-gcc -std=gnu11 -shared -fPIC -O3 -Wall -Wno-nonnull-compare -Wl,-z,max-page-size=16384 -o hook-libs/libcortex-hook-arm.so app/src/main/cpp/cortex-hook.c -ldl
          # Root mode's helper: a static executable, run as root before any chroot exists
          aarch64-linux-gnu-gcc -std=gnu11 -static -O2 -Wall -Wextra -Werror -Wl,-z,max-page-size=16384 -o hook-libs/cortex-chroot-arm64.elf app/src/main/cpp/root/cortex-chroot.c
          arm-linux-gnueabihf-gcc -std=gnu11 -static -O2 -Wall -Wextra -Werror -Wl,-z,max-page-size=16384 -o hook-libs/cortex-chroot-arm.elf app/src/main/cpp/root/cortex-chroot.c
          for helper in hook-libs/cortex-chroot-*.elf; do
            if readelf -lW "$helper" | grep -q "INTERP"; then
              echo "ERROR: $helper is not statically linked"
              exit 1
            fi
          done

          echo "Verifying 16 KB page alignment of LOAD segments in libcortex-hook-arm64.so and cortex-chroot-arm64.elf..."
          python3 - << 'EOF'
          import subprocess, sys
          for path in ("hook-libs/libcortex-hook-arm64.so", "hook-libs/cortex-chroot-arm64.elf"):
              out = subprocess.check_output(["readelf", "-lW", path], text=True)
              loads = [line.strip() for line in out.splitlines() if line.strip().startswith("LOAD")]
              if not loads:
                  print(f"ERROR: No PT_LOAD segments found in {path}")
                  sys.exit(1)
              for line in loads:
                  align_str = line.split()[-1]
                  align = int(align_str, 16) if align_str.startswith("0x") else int(align_str)
                  if align < 0x4000:
                      print(f"ERROR: PT_LOAD alignment {hex(align)} < 0x4000 in {path}: {line}")
                      sys.exit(1)
              print(f"Verified {len(loads)} PT_LOAD segments in {path} all have alignment >= 0x4000.")
          EOF

          echo "Verifying Glibc version requirements in hook libraries..."
          if readelf -V hook-libs/*.so | grep -E "GLIBC_2\.([4-9][0-9])"; then
            echo "ERROR: libcortex-hook.so requires GLIBC version higher than 2.39!"
            exit 1
          fi
          echo "All hook libraries verified: fully compatible with Ubuntu 24.04 LTS (glibc <= 2.39)."

      - name: Cache Prepared Ubuntu Bootstrap Archives
        uses: actions/cache@v4
        id: cache-bootstrap
        with:
          path: |
            app/src/main/assets/bootstrap-arm64.tar.gz
            app/src/main/assets/bootstrap-arm.tar.gz
            app/src/main/assets/cacert.pem
          key: bootstrap-rootfs-v4-${{ hashFiles('scripts/setup-extra-rootfs.sh', 'scripts/patch-bootstrap-ld.py', 'app/src/main/cpp/cortex-hook.c', 'app/src/main/cpp/hook/**', 'app/src/main/assets/*.gpg', '.github/workflows/build-release.yml') }}

      - name: Set up QEMU for multi-arch containers
        if: steps.cache-bootstrap.outputs.cache-hit != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Bundle Ubuntu 24.04 LTS Glibc Bootstrap into APK
        env:
          CACHE_HIT: ${{ steps.cache-bootstrap.outputs.cache-hit }}
        run: |
          mkdir -p app/src/main/assets

          echo "Verifying pinned Ubuntu archive keyring SHA-256..."
          ACTUAL_GPG_SHA=$(sha256sum app/src/main/assets/ubuntu-archive-keyring.gpg | awk '{print $1}')
          EXPECTED_GPG_SHA="80a36b0a6de2f69f49d2df75ef473ccde121e9e190b9ea01d20a4f63778d5c31"
          if [ "$ACTUAL_GPG_SHA" != "$EXPECTED_GPG_SHA" ]; then
            echo "ERROR: ubuntu-archive-keyring.gpg SHA-256 mismatch: expected $EXPECTED_GPG_SHA, got $ACTUAL_GPG_SHA"
            exit 1
          fi

          cp hook-libs/libcortex-hook-arm64.so app/src/main/assets/libcortex-hook-arm64.so
          cp hook-libs/libcortex-hook-arm.so app/src/main/assets/libcortex-hook-arm.so
          cp hook-libs/cortex-chroot-arm64.elf app/src/main/assets/cortex-chroot-arm64.elf
          cp hook-libs/cortex-chroot-arm.elf app/src/main/assets/cortex-chroot-arm.elf

          if [ "$CACHE_HIT" = "true" ] && [ -f app/src/main/assets/bootstrap-arm64.tar.gz ] && [ -f app/src/main/assets/bootstrap-arm.tar.gz ]; then
            echo "Using cached pre-built Ubuntu bootstrap archives. Skipping rootfs generation."
          else
            echo "Preparing dpkg tables, APT sandbox, hosts, and DNS config for bootstrap..."
          mkdir -p extra-rootfs/usr/share/dpkg extra-rootfs/etc/apt/apt.conf.d extra-rootfs/var/cache/apt/archives/partial extra-rootfs/var/lib/apt/lists/partial extra-rootfs/tmp extra-rootfs/etc extra-rootfs/etc/alternatives extra-rootfs/var/lib/dpkg/alternatives extra-rootfs/etc/dpkg/dpkg.cfg.d extra-rootfs/etc/profile.d extra-rootfs/usr/sbin extra-rootfs/etc/ssl/certs
          curl -fsSL --retry 3 -o extra-rootfs/etc/ssl/certs/ca-certificates.crt https://curl.se/ca/cacert.pem || cp /etc/ssl/certs/ca-certificates.crt extra-rootfs/etc/ssl/certs/ca-certificates.crt
          grep -q "BEGIN CERTIFICATE" extra-rootfs/etc/ssl/certs/ca-certificates.crt
          test "$(wc -c < extra-rootfs/etc/ssl/certs/ca-certificates.crt)" -gt 100000
          cp extra-rootfs/etc/ssl/certs/ca-certificates.crt app/src/main/assets/cacert.pem
          mkdir -p extra-rootfs/usr/lib/ssl extra-rootfs/etc/pki/tls/certs
          cp extra-rootfs/etc/ssl/certs/ca-certificates.crt extra-rootfs/etc/ssl/cert.pem
          cp extra-rootfs/etc/ssl/certs/ca-certificates.crt extra-rootfs/usr/lib/ssl/cert.pem
          cp extra-rootfs/etc/ssl/certs/ca-certificates.crt extra-rootfs/etc/pki/tls/certs/ca-bundle.crt
          mkdir -p extra-rootfs/usr/share/keyrings extra-rootfs/etc/apt/keyrings extra-rootfs/etc/apt/trusted.gpg.d extra-rootfs/etc/gnupg extra-rootfs/home/.gnupg extra-rootfs/root/.gnupg
          if [ -d /usr/share/keyrings ]; then
            cp -r /usr/share/keyrings/* extra-rootfs/usr/share/keyrings/ 2>/dev/null || true
          fi
          cp app/src/main/assets/*.gpg extra-rootfs/usr/share/keyrings/
          cp extra-rootfs/usr/share/keyrings/ubuntu-archive-keyring.gpg extra-rootfs/etc/apt/keyrings/ubuntu-archive-keyring.gpg
          cp extra-rootfs/usr/share/keyrings/ubuntu-archive-keyring.gpg extra-rootfs/etc/apt/trusted.gpg
          cp extra-rootfs/usr/share/keyrings/ubuntu-archive-keyring.gpg extra-rootfs/etc/apt/trusted.gpg.d/ubuntu-archive-keyring.gpg
          cp extra-rootfs/usr/share/keyrings/ubuntu-archive-keyring.gpg extra-rootfs/etc/gnupg/trustedkeys.gpg
          cp extra-rootfs/usr/share/keyrings/ubuntu-archive-keyring.gpg extra-rootfs/home/.gnupg/trustedkeys.gpg
          cp extra-rootfs/usr/share/keyrings/ubuntu-archive-keyring.gpg extra-rootfs/root/.gnupg/trustedkeys.gpg
          if [ -d /usr/share/dpkg ]; then
            cp -r /usr/share/dpkg/* extra-rootfs/usr/share/dpkg/
          fi
          if [ -d /usr/share/zoneinfo ]; then
            mkdir -p extra-rootfs/usr/share
            cp -r /usr/share/zoneinfo extra-rootfs/usr/share/
          fi
          printf 'APT::Sandbox::User "root";\nAPT::Sandbox::Seccomp "false";\nAcquire::ForceIPv4 "true";\nAcquire::Connect::AddrConfig "false";\nAcquire::SRV "false";\nAcquire::Languages "none";\nAcquire::GzipIndexes "true";\nDir::dpkg::cputable "/usr/share/dpkg/cputable";\nDir::dpkg::tupletable "/usr/share/dpkg/tupletable";\nDir::dpkg::triplettable "/usr/share/dpkg/triplettable";\nDPkg::Install::Recursive "false";\nDpkg::Progress-Fancy "false";\nAPT::Color "false";\nDPkg::Options {\n   "--force-confdef";\n   "--force-confold";\n   "--force-unsafe-io";\n};\n' > extra-rootfs/etc/apt/apt.conf.d/01sandbox
          mkdir -p extra-rootfs/etc/apt/sources.list.d
          rm -f extra-rootfs/etc/apt/sources.list
          printf 'Types: deb\nURIs: https://ports.ubuntu.com/ubuntu-ports/\nSuites: noble noble-updates noble-backports\nComponents: main restricted universe multiverse\nSigned-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg\n\nTypes: deb\nURIs: https://ports.ubuntu.com/ubuntu-ports/\nSuites: noble-security\nComponents: main restricted universe multiverse\nSigned-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg\n' > extra-rootfs/etc/apt/sources.list.d/ubuntu.sources
          chmod 0644 extra-rootfs/etc/apt/sources.list.d/ubuntu.sources
          echo "# Disabled for Cortex" > extra-rootfs/etc/apt/apt.conf.d/docker-clean
          mkdir -p extra-rootfs/etc/apt/preferences.d
          printf 'Explanation: Pin core glibc and linker packages to prevent upgrading to stock upstream packages that fail Android SECCOMP\nPackage: libc6 libc6-dev libc6-dbg\nPin: release *\nPin-Priority: -1\n\nPackage: libc-bin\nPin: release *\nPin-Priority: -1\n\nPackage: libc-dev-bin\nPin: release *\nPin-Priority: -1\n\nPackage: locales\nPin: release *\nPin-Priority: -1\n' > extra-rootfs/etc/apt/preferences.d/01cortex-pins
          printf 'force-confdef\nforce-confold\nforce-unsafe-io\nno-debsig\n' > extra-rootfs/etc/dpkg/dpkg.cfg.d/01cortex
          printf 'export DPKG_DEB_THREADS_MAX=1\nexport XZ_OPT=-T1\nexport XZ_DEFAULTS=-T1\nexport TAR_OPTIONS=--no-same-owner\nexport DEBIAN_FRONTEND=noninteractive\nexport DEBCONF_FRONTEND=noninteractive\nexport DEBCONF_NONINTERACTIVE_SEEN=true\nunset PREFIX\nexport GODEBUG=netdns=cgo\nshopt -s checkwinsize 2>/dev/null\nexport PATH="/home/.opencode/bin:/home/.local/bin:$HOME/.opencode/bin:$HOME/.local/bin:$PATH"\nif [ -n "$CORTEX_ROOT" ]; then\n  export SSL_CERT_FILE="$CORTEX_ROOT/etc/ssl/certs/ca-certificates.crt"\n  export SSL_CERT_DIR="$CORTEX_ROOT/etc/ssl/certs:/system/etc/security/cacerts"\n  export CURL_CA_BUNDLE="$CORTEX_ROOT/etc/ssl/certs/ca-certificates.crt"\n  export NODE_EXTRA_CA_CERTS="$CORTEX_ROOT/etc/ssl/certs/ca-certificates.crt"\n  export REQUESTS_CA_BUNDLE="$CORTEX_ROOT/etc/ssl/certs/ca-certificates.crt"\nelse\n  export SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt\n  export CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt\nfi\nexport TZDIR=/usr/share/zoneinfo\npython3 -c "import glob, os; [os.remove(f) for f in glob.glob(\"/var/lib/apt/lists/*_Packages\") if any(b and not b.startswith(b\"Package:\") for b in [x.strip() for x in open(f, \"rb\").read().split(b\"\\n\\n\")])]\" 2>/dev/null || true\nrm -rf /var/lib/apt/lists/partial/* 2>/dev/null || true\nif [ -d /etc/cortex/autostart ]; then\n  for s in /etc/cortex/autostart/*; do\n    if [ -f "$s" ]; then\n      sname="$(basename "$s")"\n      service "$sname" start >/dev/null 2>&1 || true\n    fi\n  done\nfi\n' > extra-rootfs/etc/profile.d/01cortex.sh

          printf '#!/bin/sh\nexit 101\n' > extra-rootfs/usr/sbin/policy-rc.d
          printf '#!/bin/sh\nexit 0\n' > extra-rootfs/usr/sbin/ldconfig
          printf '#!/bin/sh\nexit 0\n' > extra-rootfs/usr/sbin/start-stop-daemon
          mkdir -p extra-rootfs/usr/sbin extra-rootfs/usr/bin
          MAINT_TOOLS="systemd-machine-id-setup systemd-sysusers systemd-tmpfiles mandb update-mime-database update-desktop-database install-info install-sgmlcatalog"
          for tool in $MAINT_TOOLS; do
            printf '#!/bin/sh\nexit 0\n' > extra-rootfs/usr/sbin/$tool
            printf '#!/bin/sh\nexit 0\n' > extra-rootfs/usr/bin/$tool
            chmod 0755 extra-rootfs/usr/sbin/$tool extra-rootfs/usr/bin/$tool
          done
          mkdir -p extra-rootfs/boot extra-rootfs/media extra-rootfs/mnt extra-rootfs/srv extra-rootfs/opt extra-rootfs/run extra-rootfs/tmp
          chmod 0755 extra-rootfs/boot extra-rootfs/media extra-rootfs/mnt extra-rootfs/srv extra-rootfs/opt extra-rootfs/usr/sbin/*
          printf 'root:x:0:\ndaemon:x:1:\ncortex:x:0:\n' > extra-rootfs/etc/group
          printf 'root:x:0:0:root:/home:/bin/bash\ncortex:x:0:0:Cortex:/home:/bin/bash\n' > extra-rootfs/etc/passwd
          bash scripts/setup-extra-rootfs.sh
          rm -rf extra-rootfs/dev extra-rootfs/bin extra-rootfs/sbin 2>/dev/null || true

          printf '127.0.0.1 localhost localhost.localdomain\n::1 localhost ip6-localhost ip6-loopback\n' > extra-rootfs/etc/hosts
          printf 'nameserver 8.8.8.8\nnameserver 1.1.1.1\noptions timeout:1 attempts:2 rotate\n' > extra-rootfs/etc/resolv.conf
          printf 'passwd:         files\ngroup:          files\nshadow:         files\ngshadow:        files\n\nhosts:          files dns\nnetworks:       files\n\nprotocols:      db files\nservices:       db files\nethers:         db files\nrpc:            db files\n' > extra-rootfs/etc/nsswitch.conf

          echo "Preparing 64-bit Ubuntu 24.04 LTS minimal bootstrap..."
          docker pull --platform linux/arm64 ubuntu:24.04
          CID_64=$(docker create --platform linux/arm64 ubuntu:24.04 sleep 1800)
          docker cp hook-libs/libcortex-hook-arm64.so "$CID_64":/usr/lib/libcortex-hook.so
          docker cp extra-rootfs/. "$CID_64":/
          docker start "$CID_64"

          echo "Updating the packages of the ARM64 image..."
          docker exec -e DEBIAN_FRONTEND=noninteractive "$CID_64" apt-get update -o Acquire::Retries=3
          docker exec -e DEBIAN_FRONTEND=noninteractive "$CID_64" apt-get -y --no-install-recommends upgrade
          docker exec "$CID_64" apt-get clean
          docker exec "$CID_64" rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock* /var/cache/apt/archives/lock 2>/dev/null || true
          docker exec "$CID_64" rm -rf /var/cache/apt/archives/*.deb /tmp/* 2>/dev/null || true
          # No package lists in the app: they are out of date by the time anyone installs it and took
          # 58 MB of the archive (lz4, which the APK's deflate cannot shrink). /usr/local/bin/apt runs
          # "apt-get update" before the first command that needs them (apt-autoupdate.sh).
          docker exec "$CID_64" sh -c 'find /var/lib/apt/lists -mindepth 1 -maxdepth 1 ! -name partial -exec rm -rf {} +'

          docker stop "$CID_64"
          docker export "$CID_64" > app/src/main/assets/bootstrap-arm64.tar
          docker rm -f "$CID_64"

          echo "Preparing 32-bit Ubuntu 24.04 LTS minimal bootstrap..."
          docker pull --platform linux/arm/v7 ubuntu:24.04
          CID_32=$(docker create --platform linux/arm/v7 ubuntu:24.04 sleep 1800)
          docker cp hook-libs/libcortex-hook-arm.so "$CID_32":/usr/lib/libcortex-hook.so
          docker cp extra-rootfs/. "$CID_32":/
          docker start "$CID_32"

          echo "Updating the packages of the ARMv7 image..."
          docker exec -e DEBIAN_FRONTEND=noninteractive "$CID_32" apt-get update -o Acquire::Retries=3
          docker exec -e DEBIAN_FRONTEND=noninteractive "$CID_32" apt-get -y --no-install-recommends upgrade
          docker exec "$CID_32" apt-get clean
          docker exec "$CID_32" rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock* /var/cache/apt/archives/lock 2>/dev/null || true
          docker exec "$CID_32" rm -rf /var/cache/apt/archives/*.deb /tmp/* 2>/dev/null || true
          # No package lists in the app: they are out of date by the time anyone installs it and took
          # 58 MB of the archive (lz4, which the APK's deflate cannot shrink). /usr/local/bin/apt runs
          # "apt-get update" before the first command that needs them (apt-autoupdate.sh).
          docker exec "$CID_32" sh -c 'find /var/lib/apt/lists -mindepth 1 -maxdepth 1 ! -name partial -exec rm -rf {} +'

          docker stop "$CID_32"
          docker export "$CID_32" > app/src/main/assets/bootstrap-arm.tar
          docker rm -f "$CID_32"

          echo "Patching dynamic linkers in bootstrap archives for Android seccomp compliance..."
          python3 scripts/patch-bootstrap-ld.py

          echo "Compressing bootstrap archives with max gzip compression (pigz)..."
          if command -v pigz >/dev/null 2>&1; then
            pigz -9 -f app/src/main/assets/bootstrap-arm64.tar
            pigz -9 -f app/src/main/assets/bootstrap-arm.tar
          else
            gzip -9 -f app/src/main/assets/bootstrap-arm64.tar
            gzip -9 -f app/src/main/assets/bootstrap-arm.tar
          fi
          fi

          if [ ! -f app/src/main/assets/cacert.pem ]; then
            curl -fsSL --retry 3 -o app/src/main/assets/cacert.pem https://curl.se/ca/cacert.pem || cp /etc/ssl/certs/ca-certificates.crt app/src/main/assets/cacert.pem
          fi
          grep -q "BEGIN CERTIFICATE" app/src/main/assets/cacert.pem
          test "$(wc -c < app/src/main/assets/cacert.pem)" -gt 100000

          ls -lh app/src/main/assets/

      - name: Build C development overlays (libc6-dev and its dependencies)
        run: |
          set -euo pipefail
          # Cortex pins its patched glibc, which keeps Ubuntu's libc6-dev (and build-essential, g++, every -dev
          # package) from being installed. These tarballs hold the stock libc6-dev, libc-dev-bin, libcrypt-dev,
          # linux-libc-dev and rpcsvc-proto, registered in dpkg's database; the app unpacks them next to the
          # pinned glibc (DevPackages.kt). The indexes are checked against the pinned archive keyring.
          python3 scripts/build-dev-overlay.py --arch arm64 --keyring app/src/main/assets/ubuntu-archive-keyring.gpg --out app/src/main/assets/devpkgs-arm64.tar.gz
          python3 scripts/build-dev-overlay.py --arch armhf --keyring app/src/main/assets/ubuntu-archive-keyring.gpg --out app/src/main/assets/devpkgs-arm.tar.gz
          ls -lh app/src/main/assets/devpkgs-*

      - name: Run Native & Shell Script Tests and Verify PR Debug Build
        if: github.event_name == 'pull_request'
        run: |
          gcc -std=gnu11 -O2 -Wall -Wextra -pthread tests/native/test_cortex_native.c -o /tmp/test_cortex_native -ldl
          /tmp/test_cortex_native
          gcc -std=gnu11 -O2 -Wall -Wextra tests/bench/micro.c -o /tmp/micro_bench
          bash tests/scripts/test_shell_scripts.sh
          python3 -m unittest discover -s tests/scripts -p 'test_dev_overlay.py'
          sudo CORTEX_REQUIRE_ROOT_TESTS=1 bash tests/root/test_cortex_chroot.sh
          ./gradlew testDebugUnitTest lintDebug assembleDebug --build-cache --parallel --stacktrace

          DEBUG_ARM64_APK=$(find app/build/outputs/apk/debug -name "*arm64-v8a*.apk" | head -n 1)
          if [ -z "$DEBUG_ARM64_APK" ]; then
            echo "ERROR: Debug arm64-v8a APK not found"
            exit 1
          fi
          rm -rf /tmp/apk-check && mkdir -p /tmp/apk-check
          unzip -q "$DEBUG_ARM64_APK" "lib/arm64-v8a/libcortex-pty.so" -d /tmp/apk-check
          python3 - << 'EOF'
          import subprocess, sys
          out = subprocess.check_output(["readelf", "-lW", "/tmp/apk-check/lib/arm64-v8a/libcortex-pty.so"], text=True)
          loads = [line.strip() for line in out.splitlines() if line.strip().startswith("LOAD")]
          if not loads:
              print("ERROR: No PT_LOAD segments found in libcortex-pty.so")
              sys.exit(1)
          for line in loads:
              align_str = line.split()[-1]
              align = int(align_str, 16) if align_str.startswith("0x") else int(align_str)
              if align < 0x4000:
                  print(f"ERROR: PT_LOAD alignment {hex(align)} < 0x4000 in: {line}")
                  sys.exit(1)
          print(f"Verified {len(loads)} PT_LOAD segments in debug libcortex-pty.so all have alignment >= 0x4000.")
          EOF

      - name: Upload the Debug APK for the Emulator Test
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cortex-debug-apk
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 3

      - name: Build Release APKs
        if: github.event_name != 'pull_request'
        env:
          RELEASE_STORE_FILE: app/cortex-release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          gcc -std=gnu11 -O2 -Wall -Wextra -pthread tests/native/test_cortex_native.c -o /tmp/test_cortex_native -ldl
          /tmp/test_cortex_native
          gcc -std=gnu11 -O2 -Wall -Wextra tests/bench/micro.c -o /tmp/micro_bench
          bash tests/scripts/test_shell_scripts.sh
          python3 -m unittest discover -s tests/scripts -p 'test_dev_overlay.py'
          sudo CORTEX_REQUIRE_ROOT_TESTS=1 bash tests/root/test_cortex_chroot.sh
          ./gradlew testDebugUnitTest lintDebug assembleRelease --build-cache --parallel --stacktrace

      - name: Prepare and Verify Signed APKs
        if: github.event_name != 'pull_request'
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_OLD_STORE_PASSWORD: ${{ secrets.RELEASE_OLD_STORE_PASSWORD }}
          RELEASE_OLD_KEY_ALIAS: ${{ secrets.RELEASE_OLD_KEY_ALIAS }}
          RELEASE_OLD_KEY_PASSWORD: ${{ secrets.RELEASE_OLD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          KS_FILE="app/cortex-release.keystore"
          OLD_KS_FILE="app/cortex-release-old.keystore"
          LINEAGE="signing/cortex.lineage"
          echo "Using build-tools: $BUILD_TOOLS_DIR"

          mkdir -p release-apks

          ARM64_RAW=$(find app/build/outputs/apk/release -name "*arm64-v8a*.apk" | head -n 1)
          ARM32_RAW=$(find app/build/outputs/apk/release -name "*armeabi-v7a*.apk" | head -n 1)

          echo "Found 64-bit APK: $ARM64_RAW"
          echo "Found 32-bit APK: $ARM32_RAW"

          # Signing key rotation (APK Signature Scheme v3.x): the APK carries the proof that the new
          # key succeeds the old one (signing/cortex.lineage). Android 13+ uses the new key (v3.1
          # block); older devices keep seeing the original key, so installed copies keep updating.
          sign_apk() {
            "$APKSIGNER" sign \
              --ks "$OLD_KS_FILE" --ks-key-alias "$RELEASE_OLD_KEY_ALIAS" \
              --ks-pass "pass:$RELEASE_OLD_STORE_PASSWORD" --key-pass "pass:$RELEASE_OLD_KEY_PASSWORD" \
              --next-signer \
              --ks "$KS_FILE" --ks-key-alias "$RELEASE_KEY_ALIAS" \
              --ks-pass "pass:$RELEASE_STORE_PASSWORD" --key-pass "pass:$RELEASE_KEY_PASSWORD" \
              --lineage "$LINEAGE" \
              --rotation-min-sdk-version 33 \
              --out "$2" "$1"
          }

          # Verify 16 KB page alignment on arm64 native libraries inside the built APK
          rm -rf /tmp/apk-check && mkdir -p /tmp/apk-check
          unzip -q "$ARM64_RAW" "lib/arm64-v8a/libcortex-pty.so" "assets/libcortex-hook-arm64.so" -d /tmp/apk-check
          python3 - << 'EOF'
          import subprocess, sys
          for path in ("/tmp/apk-check/lib/arm64-v8a/libcortex-pty.so", "/tmp/apk-check/assets/libcortex-hook-arm64.so"):
              out = subprocess.check_output(["readelf", "-lW", path], text=True)
              loads = [line.strip() for line in out.splitlines() if line.strip().startswith("LOAD")]
              if not loads:
                  print(f"ERROR: No PT_LOAD segments found in {path}")
                  sys.exit(1)
              for line in loads:
                  align_str = line.split()[-1]
                  align = int(align_str, 16) if align_str.startswith("0x") else int(align_str)
                  if align < 0x4000:
                      print(f"ERROR: PT_LOAD alignment {hex(align)} < 0x4000 in {path}: {line}")
                      sys.exit(1)
              print(f"Verified {len(loads)} PT_LOAD segments in {path} all have alignment >= 0x4000.")
          EOF

          echo "Assets in the raw APKs (before stripping):"
          for raw in "$ARM64_RAW" "$ARM32_RAW"; do echo "$raw:"; unzip -l "$raw" | awk '$4 ~ /^assets\// {print "  " $1 " " $4}'; done

          # 1. Strip opposite arch assets from 64-bit APK to minimize download size
          echo "Optimizing 64-bit APK size: stripping 32-bit assets..."
          zip -d "$ARM64_RAW" "assets/bootstrap-arm.tar*" "assets/devpkgs-arm.tar*" "assets/libcortex-hook-arm.so" "assets/cortex-chroot-arm.elf" || true
          $ZIPALIGN -f -p 4 "$ARM64_RAW" release-apks/arm64-aligned.apk
          sign_apk release-apks/arm64-aligned.apk release-apks/Cortex-arm64-v8a-signed.apk
          rm -f release-apks/arm64-aligned.apk

          # 2. Strip opposite arch assets from 32-bit APK to minimize download size
          echo "Optimizing 32-bit APK size: stripping 64-bit assets..."
          zip -d "$ARM32_RAW" "assets/bootstrap-arm64.tar*" "assets/devpkgs-arm64.tar*" "assets/libcortex-hook-arm64.so" "assets/cortex-chroot-arm64.elf" || true
          $ZIPALIGN -f -p 4 "$ARM32_RAW" release-apks/arm32-aligned.apk
          sign_apk release-apks/arm32-aligned.apk release-apks/Cortex-armeabi-v7a-signed.apk
          rm -f release-apks/arm32-aligned.apk

          # Verify signatures, certificates and the rotation lineage
          fingerprint() {
            keytool -list -v -keystore "$1" -storepass "$2" -alias "$3" | awk '/SHA256:/ {gsub(":", "", $2); print tolower($2); exit}'
          }
          NEW_FP=$(fingerprint "$KS_FILE" "$RELEASE_STORE_PASSWORD" "$RELEASE_KEY_ALIAS")
          OLD_FP=$(fingerprint "$OLD_KS_FILE" "$RELEASE_OLD_STORE_PASSWORD" "$RELEASE_OLD_KEY_ALIAS")
          if [ -z "$NEW_FP" ] || [ -z "$OLD_FP" ] || [ "$NEW_FP" = "$OLD_FP" ]; then
            echo "ERROR: could not read two different certificate fingerprints (new='$NEW_FP' old='$OLD_FP')"
            exit 1
          fi
          echo "New signing certificate SHA-256: $NEW_FP"
          echo "Old signing certificate SHA-256: $OLD_FP"

          LINEAGE_OUT=$("$APKSIGNER" lineage --in "$LINEAGE" --print-certs)
          echo "$LINEAGE_OUT" | tr 'A-Z' 'a-z' | grep -q "$OLD_FP" || { echo "ERROR: lineage does not contain the old certificate"; exit 1; }
          echo "$LINEAGE_OUT" | tr 'A-Z' 'a-z' | grep -q "$NEW_FP" || { echo "ERROR: lineage does not contain the new certificate"; exit 1; }

          for apk in release-apks/Cortex-arm64-v8a-signed.apk release-apks/Cortex-armeabi-v7a-signed.apk; do
            CERT_OUT=$("$APKSIGNER" verify --verbose --print-certs "$apk")
            echo "$CERT_OUT"
            if echo "$CERT_OUT" | grep -qi "Android Debug"; then
              echo "ERROR: $apk is signed with an Android Debug certificate!"
              exit 1
            fi
            echo "$CERT_OUT" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" || { echo "ERROR: $apk has no valid v2 signature"; exit 1; }
            echo "$CERT_OUT" | grep -q "Verified using v3.1 scheme (APK Signature Scheme v3.1): true" || { echo "ERROR: $apk has no valid v3.1 (key rotation) signature"; exit 1; }
            V31_FP=$(echo "$CERT_OUT" | awk '/V3\.1 Signer:.*certificate SHA-256 digest:/ {print tolower($NF); exit}')
            V30_FP=$(echo "$CERT_OUT" | awk '/V3\.0 Signer:.*certificate SHA-256 digest:/ {print tolower($NF); exit}')
            if [ "$V31_FP" != "$NEW_FP" ]; then
              echo "ERROR: $apk v3.1 signer is '$V31_FP', expected the new certificate $NEW_FP"
              exit 1
            fi
            if [ "$V30_FP" != "$OLD_FP" ]; then
              echo "ERROR: $apk v3.0 signer is '$V30_FP', expected the original certificate $OLD_FP"
              exit 1
            fi
          done

          # Each APK carries the bootstrap, the hook, root mode's helper and the C development overlay of its own architecture only
          check_assets() {
            unzip -l "$1" > /tmp/apk-assets.txt
            for need in "assets/bootstrap-$2.tar" "assets/devpkgs-$2.tar" "assets/libcortex-hook-$2.so" "assets/cortex-chroot-$2.elf"; do
              grep -q "$need" /tmp/apk-assets.txt || { echo "ERROR: $1 has no $need"; exit 1; }
            done
            for stray in "assets/bootstrap-$3.tar" "assets/devpkgs-$3.tar" "assets/libcortex-hook-$3.so" "assets/cortex-chroot-$3.elf"; do
              if grep -q "$stray" /tmp/apk-assets.txt; then echo "ERROR: $1 still carries $stray"; exit 1; fi
            done
          }
          check_assets release-apks/Cortex-arm64-v8a-signed.apk arm64 arm
          check_assets release-apks/Cortex-armeabi-v7a-signed.apk arm arm64

          echo "Final optimized APK sizes:"
          ls -lh release-apks/
          echo "APKs signed and verified successfully."

      - name: Upload Artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cortex-release-apks
          path: release-apks/*.apk
          retention-days: ${{ github.event.inputs.dry_run == 'true' && 1 || 90 }}

      - name: Create GitHub Release
        if: github.event_name != 'pull_request' && github.event.inputs.dry_run != 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Dry run: nothing is published."
            exit 0
          fi
          GRADLE_VER=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$GRADLE_VER" ]; then
            GRADLE_VER="1.25.25"
          fi
          VERSION="v${GRADLE_VER#v}"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          fi

          echo "Preparing release $VERSION..."

          PRERELEASE_FLAG=""
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          # An automatic run (a push) must not replace the pre-release of this version with a full
          # release: the in-app updater would offer it to everybody. Promotion is a manual decision
          # (gh release edit --prerelease=false --latest) or a manual run with prerelease unticked.
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] &&
             [ "$(gh release view "$VERSION" --json isPrerelease --jq .isPrerelease 2>/dev/null)" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          if [ -n "$PRERELEASE_FLAG" ]; then
            echo "Publishing $VERSION as a pre-release."
          fi

          # Delete existing release/tag with same version if present so update succeeds cleanly
          gh release delete "$VERSION" --yes --cleanup-tag 2>/dev/null || true
          git tag -d "$VERSION" 2>/dev/null || true
          git push --delete origin "$VERSION" 2>/dev/null || true

          # The notes are the section of this version in CHANGELOG.md ("## 1.26.33 (date)" up to the
          # next "## "), with "###" headings one level down; a version without a section gets the
          # general description.
          awk -v ver="${VERSION#v}" '
            /^## / { if (found) exit; if ($2 == ver) { found = 1; next } }
            found { sub(/^### /, "#### "); print }
          ' CHANGELOG.md > changes.md
          {
            echo "### Cortex Release $VERSION"
            echo
            if grep -q '[^[:space:]]' changes.md; then
              cat changes.md
            else
              echo "Cortex runs **Ubuntu 24.04 LTS (Noble Numbat)** with **glibc 2.39** natively on Android: no root, no PRoot, no containers, no virtual machine."
            fi
            echo
            echo "#### Downloads"
            echo "- \`Cortex-arm64-v8a-signed.apk\`: 64-bit ARM (almost all current phones)"
            echo "- \`Cortex-armeabi-v7a-signed.apk\`: 32-bit ARM"
            echo
            echo "How to verify a download: [signing/README.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/signing/README.md). All versions: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)."
          } > release-notes.md
          echo "Release notes:"
          cat release-notes.md

          gh release create "$VERSION" \
            release-apks/Cortex-arm64-v8a-signed.apk \
            release-apks/Cortex-armeabi-v7a-signed.apk \
            --title "Cortex Release $VERSION" \
            --notes-file release-notes.md \
            $PRERELEASE_FLAG

  # Installs the arm64 APK on an Android emulator and runs Ubuntu in it as a user would (see
  # emulator-test.yml): for pull requests, dry runs, and on request for the APKs of an earlier run.
  emulator-test:
    name: Emulator Test
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' && (github.event_name == 'pull_request' || github.event.inputs.dry_run == 'true') || needs.build.result == 'skipped' && inputs.emulator_test_of_run) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/emulator-test.yml
    with:
      run-id: ${{ inputs.emulator_test_of_run }}
